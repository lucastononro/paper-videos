<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>📄</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>paper-videos editor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1117;
        --bg-elev: #161b22;
        --bg-elev-2: #1c2330;
        --border: #2a313c;
        --text: #e6edf3;
        --text-mute: #8b949e;
        --accent: #ffd866;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        /* Keep the page itself non-scrollable — every panel handles its own
           overflow internally, so the chat's input bar stays pinned to the
           bottom of the viewport regardless of how many messages are above. */
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: 14px;
      }
      /* Global spinner keyframe — used by the gallery's running indicator
         and by tool-card spinners inside the chat. */
      @keyframes tool-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Pulse animation for the in-flight ring on gallery cards. */
      @keyframes inflight-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(121, 192, 255, 0.35);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(121, 192, 255, 0);
        }
      }
      /* Soft opacity pulse — used by the "syncing" badge in the right-pane
         tabs while a chokidar-driven reload is in flight. */
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }
      /* Per-card delete affordance on the gallery — hidden by default,
         revealed on card hover. Sits top-left of the thumbnail. */
      .project-card-delete {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: rgba(13, 17, 23, 0.85);
        color: #ff9494;
        border: 1px solid rgba(255, 148, 148, 0.4);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition:
          opacity 0.12s,
          background 0.12s;
        font-family: inherit;
        line-height: 1;
        padding: 0;
      }
      [role='button']:hover .project-card-delete,
      .project-card-delete:focus-visible {
        opacity: 1;
      }
      .project-card-delete:hover {
        background: rgba(255, 107, 107, 0.85);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
