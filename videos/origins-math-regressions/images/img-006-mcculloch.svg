<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </radialGradient>
    <linearGradient id="silhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3142"/>
      <stop offset="100%" stop-color="#161b25"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Silhouette portrait (head + shoulders) -->
  <g transform="translate(960,460)">
    <!-- shoulders -->
    <path d="M -260 360 C -260 220, -180 160, -110 150 L 110 150 C 180 160, 260 220, 260 360 Z" fill="url(#silhouette)"/>
    <!-- neck -->
    <rect x="-50" y="100" width="100" height="80" fill="url(#silhouette)"/>
    <!-- head -->
    <ellipse cx="0" cy="0" rx="130" ry="160" fill="url(#silhouette)"/>
    <!-- hair / beard suggestion (light hairline at top, wide beard at bottom) -->
    <path d="M -120 -90 C -100 -160, 100 -160, 120 -90" fill="none" stroke="#3a4458" stroke-width="3" opacity="0.5"/>
    <ellipse cx="0" cy="80" rx="80" ry="50" fill="#1f2530" opacity="0.7"/>
  </g>

  <!-- Caption -->
  <g text-anchor="middle" font-family="Georgia, serif" fill="#e6edf3">
    <text x="960" y="900" font-size="64" font-weight="600">Warren S. McCulloch</text>
    <text x="960" y="970" font-size="36" fill="#58a6ff" font-style="italic">1898 — 1969 · neurophysiologist</text>
    <text x="960" y="1030" font-size="26" fill="#8b949e">University of Illinois</text>
  </g>
</svg>
