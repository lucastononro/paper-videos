<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid meet">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#0e1117"/>

  <!-- A subtle radial vignette to soften the edges -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0e1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- Decorative top rule -->
  <line x1="600" y1="380" x2="1320" y2="380" stroke="#58a6ff" stroke-width="1.5" opacity="0.55"/>

  <!-- Name -->
  <text x="960" y="495" text-anchor="middle"
        font-family="'EB Garamond', Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="84" fill="#e6edf3" letter-spacing="2">
    Adélaïde-Marie Demante
  </text>

  <!-- Sub-line: dates -->
  <text x="960" y="565" text-anchor="middle"
        font-family="'EB Garamond', Georgia, 'Times New Roman', serif"
        font-size="38" fill="#9aa3b2" letter-spacing="6">
    1788 — 1872
  </text>

  <!-- Role line -->
  <text x="960" y="660" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', sans-serif"
        font-size="30" fill="#cfd8e3" letter-spacing="3">
    Évariste's mother — his first teacher
  </text>

  <!-- Decorative bottom rule -->
  <line x1="600" y1="720" x2="1320" y2="720" stroke="#58a6ff" stroke-width="1.5" opacity="0.55"/>

  <!-- Quiet footnote -->
  <text x="960" y="990" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', sans-serif"
        font-size="20" fill="#6b7280" font-style="italic">
    no surviving portrait
  </text>
</svg>
