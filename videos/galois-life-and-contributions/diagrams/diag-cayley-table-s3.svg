<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .titleText { font-family: Inter, "Helvetica Neue", sans-serif; font-weight: 600; fill: #e6edf3; }
      .subTitle  { font-family: Inter, "Helvetica Neue", sans-serif; font-weight: 400; fill: #9aa3b2; }
      .axisLabel { font-family: "Latin Modern Math", "Cambria Math", Georgia, serif; font-style: italic; fill: #e6edf3; }
      .cellText  { font-family: "Latin Modern Math", "Cambria Math", Georgia, serif; font-style: italic; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#0e1117"/>

  <text x="960" y="92" text-anchor="middle" class="titleText" font-size="46">S₃ — the symmetries of the equation</text>
  <text x="960" y="138" text-anchor="middle" class="subTitle" font-size="24">The smallest non-abelian group · six elements · order matters: a · b ≠ b · a</text>

  <g transform="translate(450, 220)">
    <rect x="0" y="0" width="700" height="700" rx="14" ry="14" fill="#161b22" stroke="#2d333b" stroke-width="2"/>

    <rect x="100" y="0" width="600" height="100" fill="#1a1f2a"/>
    <rect x="0" y="100" width="100" height="600" fill="#1a1f2a"/>
    <text x="50" y="68" text-anchor="middle" class="axisLabel" font-size="44">·</text>

    <g class="axisLabel" font-size="38">
      <text x="150" y="65" text-anchor="middle">e</text>
      <text x="250" y="65" text-anchor="middle">r</text>
      <text x="350" y="65" text-anchor="middle">r²</text>
      <text x="450" y="65" text-anchor="middle">s</text>
      <text x="550" y="65" text-anchor="middle">sr</text>
      <text x="650" y="65" text-anchor="middle">sr²</text>
    </g>
    <g class="axisLabel" font-size="38">
      <text x="50" y="165" text-anchor="middle">e</text>
      <text x="50" y="265" text-anchor="middle">r</text>
      <text x="50" y="365" text-anchor="middle">r²</text>
      <text x="50" y="465" text-anchor="middle">s</text>
      <text x="50" y="565" text-anchor="middle">sr</text>
      <text x="50" y="665" text-anchor="middle">sr²</text>
    </g>

    <g>
      <rect x="100" y="100" width="100" height="100" fill="#4a5160"/>
      <rect x="200" y="100" width="100" height="100" fill="#58a6ff"/>
      <rect x="300" y="100" width="100" height="100" fill="#3b82f6"/>
      <rect x="400" y="100" width="100" height="100" fill="#ffd866"/>
      <rect x="500" y="100" width="100" height="100" fill="#f97583"/>
      <rect x="600" y="100" width="100" height="100" fill="#c792ea"/>
    </g>
    <g>
      <rect x="100" y="200" width="100" height="100" fill="#58a6ff"/>
      <rect x="200" y="200" width="100" height="100" fill="#3b82f6"/>
      <rect x="300" y="200" width="100" height="100" fill="#4a5160"/>
      <rect x="400" y="200" width="100" height="100" fill="#c792ea"/>
      <rect x="500" y="200" width="100" height="100" fill="#ffd866"/>
      <rect x="600" y="200" width="100" height="100" fill="#f97583"/>
    </g>
    <g>
      <rect x="100" y="300" width="100" height="100" fill="#3b82f6"/>
      <rect x="200" y="300" width="100" height="100" fill="#4a5160"/>
      <rect x="300" y="300" width="100" height="100" fill="#58a6ff"/>
      <rect x="400" y="300" width="100" height="100" fill="#f97583"/>
      <rect x="500" y="300" width="100" height="100" fill="#c792ea"/>
      <rect x="600" y="300" width="100" height="100" fill="#ffd866"/>
    </g>
    <g>
      <rect x="100" y="400" width="100" height="100" fill="#ffd866"/>
      <rect x="200" y="400" width="100" height="100" fill="#f97583"/>
      <rect x="300" y="400" width="100" height="100" fill="#c792ea"/>
      <rect x="400" y="400" width="100" height="100" fill="#4a5160"/>
      <rect x="500" y="400" width="100" height="100" fill="#58a6ff"/>
      <rect x="600" y="400" width="100" height="100" fill="#3b82f6"/>
    </g>
    <g>
      <rect x="100" y="500" width="100" height="100" fill="#f97583"/>
      <rect x="200" y="500" width="100" height="100" fill="#c792ea"/>
      <rect x="300" y="500" width="100" height="100" fill="#ffd866"/>
      <rect x="400" y="500" width="100" height="100" fill="#3b82f6"/>
      <rect x="500" y="500" width="100" height="100" fill="#4a5160"/>
      <rect x="600" y="500" width="100" height="100" fill="#58a6ff"/>
    </g>
    <g>
      <rect x="100" y="600" width="100" height="100" fill="#c792ea"/>
      <rect x="200" y="600" width="100" height="100" fill="#ffd866"/>
      <rect x="300" y="600" width="100" height="100" fill="#f97583"/>
      <rect x="400" y="600" width="100" height="100" fill="#58a6ff"/>
      <rect x="500" y="600" width="100" height="100" fill="#3b82f6"/>
      <rect x="600" y="600" width="100" height="100" fill="#4a5160"/>
    </g>

    <g class="cellText" font-size="34" text-anchor="middle">
      <text x="150" y="170">e</text>   <text x="250" y="170">r</text>   <text x="350" y="170">r²</text>
      <text x="450" y="170">s</text>   <text x="550" y="170">sr</text>  <text x="650" y="170">sr²</text>

      <text x="150" y="270">r</text>   <text x="250" y="270">r²</text>  <text x="350" y="270">e</text>
      <text x="450" y="270">sr²</text> <text x="550" y="270">s</text>   <text x="650" y="270">sr</text>

      <text x="150" y="370">r²</text>  <text x="250" y="370">e</text>   <text x="350" y="370">r</text>
      <text x="450" y="370">sr</text>  <text x="550" y="370">sr²</text> <text x="650" y="370">s</text>

      <text x="150" y="470">s</text>   <text x="250" y="470">sr</text>  <text x="350" y="470">sr²</text>
      <text x="450" y="470">e</text>   <text x="550" y="470">r</text>   <text x="650" y="470">r²</text>

      <text x="150" y="570">sr</text>  <text x="250" y="570">sr²</text> <text x="350" y="570">s</text>
      <text x="450" y="570">r²</text>  <text x="550" y="570">e</text>   <text x="650" y="570">r</text>

      <text x="150" y="670">sr²</text> <text x="250" y="670">s</text>   <text x="350" y="670">sr</text>
      <text x="450" y="670">r</text>   <text x="550" y="670">r²</text>  <text x="650" y="670">e</text>
    </g>

    <g stroke="#0e1117" stroke-width="2" fill="none" opacity="0.95">
      <line x1="100" y1="0"   x2="100" y2="700"/>
      <line x1="200" y1="0"   x2="200" y2="700"/>
      <line x1="300" y1="0"   x2="300" y2="700"/>
      <line x1="400" y1="0"   x2="400" y2="700"/>
      <line x1="500" y1="0"   x2="500" y2="700"/>
      <line x1="600" y1="0"   x2="600" y2="700"/>
      <line x1="0" y1="100" x2="700" y2="100"/>
      <line x1="0" y1="200" x2="700" y2="200"/>
      <line x1="0" y1="300" x2="700" y2="300"/>
      <line x1="0" y1="400" x2="700" y2="400"/>
      <line x1="0" y1="500" x2="700" y2="500"/>
      <line x1="0" y1="600" x2="700" y2="600"/>
    </g>

    <line x1="100" y1="0"   x2="100" y2="700" stroke="#e6edf3" stroke-width="2" opacity="0.7"/>
    <line x1="0"   y1="100" x2="700" y2="100" stroke="#e6edf3" stroke-width="2" opacity="0.7"/>
  </g>

  <g transform="translate(1240, 280)">
    <text x="0" y="-22" class="titleText" font-size="26">elements</text>
    <g font-family="Inter, sans-serif" font-size="22" fill="#e6edf3">
      <rect x="0" y="6"   width="36" height="36" fill="#4a5160" rx="4"/>
      <text x="56" y="33">e   identity</text>

      <rect x="0" y="56"  width="36" height="36" fill="#58a6ff" rx="4"/>
      <text x="56" y="83">r   rotation by 120°</text>

      <rect x="0" y="106" width="36" height="36" fill="#3b82f6" rx="4"/>
      <text x="56" y="133">r²  rotation by 240°</text>

      <rect x="0" y="156" width="36" height="36" fill="#ffd866" rx="4"/>
      <text x="56" y="183">s   reflection</text>

      <rect x="0" y="206" width="36" height="36" fill="#f97583" rx="4"/>
      <text x="56" y="233">sr  reflection · rotation</text>

      <rect x="0" y="256" width="36" height="36" fill="#c792ea" rx="4"/>
      <text x="56" y="283">sr² reflection · rotation²</text>
    </g>
    <g font-family="Inter, sans-serif" font-size="18" fill="#9aa3b2">
      <text x="0" y="340">relations:</text>
      <text x="0" y="368" font-style="italic">  r³ = e ,  s² = e ,  s r s = r⁻¹</text>
    </g>
  </g>

  <text x="960" y="1015" text-anchor="middle" class="subTitle" font-size="20" font-style="italic">
    Read row · column. Cells colored by the result. Every row and every column is a permutation of all six elements.
  </text>
</svg>
