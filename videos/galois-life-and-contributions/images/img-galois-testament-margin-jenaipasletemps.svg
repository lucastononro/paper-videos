<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="paperGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a3026" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0e1117" stop-opacity="1"/>
    </radialGradient>
    <pattern id="paperGrain" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="transparent"/>
      <circle cx="1" cy="1" r="0.4" fill="#cfb98a" fill-opacity="0.06"/>
      <circle cx="4" cy="3" r="0.3" fill="#cfb98a" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#0e1117"/>
  <rect width="1920" height="1080" fill="url(#paperGrad)"/>
  <rect width="1920" height="1080" fill="url(#paperGrain)"/>

  <!-- A faint margin rule, like ruled paper turned on its side -->
  <line x1="320" y1="540" x2="1600" y2="540" stroke="#cfb98a" stroke-opacity="0.10" stroke-width="2"/>

  <!-- The famous margin annotation, in a calligraphic French hand -->
  <g transform="translate(960, 470) rotate(-3)">
    <text
      text-anchor="middle"
      font-family="'Brush Script MT', 'Lucida Handwriting', 'Apple Chancery', cursive"
      font-style="italic"
      font-size="170"
      fill="#f4ead0"
      letter-spacing="2">
      Je n'ai pas le temps.
    </text>
  </g>

  <!-- An English translation, smaller, beneath -->
  <g transform="translate(960, 660)">
    <text
      text-anchor="middle"
      font-family="'EB Garamond', Georgia, 'Times New Roman', serif"
      font-style="italic"
      font-size="44"
      fill="#cfb98a"
      fill-opacity="0.78"
      letter-spacing="6">
      I have no time.
    </text>
  </g>

  <!-- Date / context line at the foot -->
  <g transform="translate(960, 940)">
    <text
      text-anchor="middle"
      font-family="'EB Garamond', Georgia, 'Times New Roman', serif"
      font-size="28"
      fill="#9ba0a6"
      fill-opacity="0.85"
      letter-spacing="3">
      Margin annotation, Mémoire of Évariste Galois — 29 May 1832
    </text>
  </g>
</svg>
