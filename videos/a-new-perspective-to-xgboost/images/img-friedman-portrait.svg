<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>

  <!-- Header -->
  <text x="960" y="100" font-family="Inter, sans-serif" font-size="48" fill="#e6edf3" text-anchor="middle" font-weight="700">Jerome H. Friedman</text>
  <text x="960" y="148" font-family="Inter, sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">Stanford Statistics — boosting as gradient descent in function space</text>

  <!-- Portrait silhouette (centered, large) -->
  <g transform="translate(700, 600)">
    <rect x="-230" y="-290" width="460" height="560" rx="16" fill="#161b22" stroke="#ffd866" stroke-width="3"/>
    <!-- subtle inner border -->
    <rect x="-218" y="-278" width="436" height="536" rx="10" fill="none" stroke="#2a3140" stroke-width="1"/>
    <!-- head -->
    <circle cx="0" cy="-110" r="96" fill="#2a3140" stroke="#ffd866" stroke-width="2"/>
    <!-- shoulders -->
    <path d="M -190 250 Q -190 30 -115 -10 Q -60 30 0 30 Q 60 30 115 -10 Q 190 30 190 250 Z" fill="#2a3140" stroke="#ffd866" stroke-width="2"/>
    <!-- glasses hint (Friedman is bespectacled in most photos) -->
    <circle cx="-32" cy="-118" r="22" fill="none" stroke="#ffd866" stroke-width="2.5"/>
    <circle cx="32" cy="-118" r="22" fill="none" stroke="#ffd866" stroke-width="2.5"/>
    <line x1="-10" y1="-118" x2="10" y2="-118" stroke="#ffd866" stroke-width="2"/>
  </g>

  <!-- Bio block on right -->
  <g transform="translate(1110, 360)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="32" fill="#ffd866" font-weight="700">Jerome H. Friedman</text>
    <text x="0" y="44" font-family="Inter, sans-serif" font-size="22" fill="#c9d1d9">Professor of Statistics</text>
    <text x="0" y="74" font-family="Inter, sans-serif" font-size="22" fill="#c9d1d9">Stanford University</text>
    <line x1="0" y1="108" x2="540" y2="108" stroke="#30363d" stroke-width="2"/>

    <text x="0" y="156" font-family="Inter, sans-serif" font-size="22" fill="#58a6ff" font-weight="700">Key contributions</text>
    <text x="0" y="194" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">CART (with Breiman, Olshen, Stone)</text>
    <text x="0" y="224" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">MARS — multivariate adaptive regression splines</text>
    <text x="0" y="254" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Projection pursuit</text>
    <text x="0" y="284" font-family="Inter, sans-serif" font-size="20" fill="#f97583" font-weight="600">Gradient Boosting Machine (2001)</text>

    <text x="0" y="336" font-family="Inter, sans-serif" font-size="22" fill="#58a6ff" font-weight="700">The 2001 insight</text>
    <text x="0" y="374" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Boosting is not weighted voting —</text>
    <text x="0" y="404" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">it is gradient descent</text>
    <text x="0" y="434" font-family="Inter, sans-serif" font-size="20" fill="#ffd866" font-weight="600">in the space of functions.</text>
  </g>

  <!-- Footer attribution -->
  <text x="960" y="1010" font-family="JetBrains Mono, monospace" font-size="18" fill="#6e7681" text-anchor="middle">Stylized portrait — Friedman 2001: "Greedy Function Approximation: A Gradient Boosting Machine"</text>
</svg>
