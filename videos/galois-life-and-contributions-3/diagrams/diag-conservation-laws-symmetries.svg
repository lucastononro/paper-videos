<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg-noether" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1117"/>
      <stop offset="1" stop-color="#171c25"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-noether)"/>

  <!-- Title -->
  <text x="960" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#e6edf3" letter-spacing="3">NOETHER'S THEOREM</text>
  <text x="960" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#ffd866" opacity="0.85">Every continuous symmetry  ↔  one conservation law</text>

  <!-- Three columns -->
  <g font-family="Georgia, serif" fill="#e6edf3">
    <!-- Column 1: Time -->
    <g transform="translate(320, 280)">
      <rect x="0" y="0" width="380" height="640" fill="#1a212e" rx="14"/>
      <rect x="0" y="0" width="380" height="640" fill="none" stroke="#58a6ff" stroke-width="2" rx="14" opacity="0.6"/>

      <text x="190" y="60" text-anchor="middle" font-size="26" fill="#58a6ff" letter-spacing="3">SYMMETRY</text>

      <!-- Clock icon -->
      <g transform="translate(190, 200)" stroke="#58a6ff" stroke-width="3" fill="none">
        <circle cx="0" cy="0" r="80"/>
        <line x1="0" y1="0" x2="0" y2="-50"/>
        <line x1="0" y1="0" x2="40" y2="20"/>
        <circle cx="0" cy="0" r="4" fill="#58a6ff"/>
      </g>

      <text x="190" y="350" text-anchor="middle" font-size="28" font-weight="bold">Time-translation</text>
      <text x="190" y="385" text-anchor="middle" font-size="20" font-style="italic" opacity="0.8">"yesterday = today"</text>

      <line x1="60" y1="430" x2="320" y2="430" stroke="#ffd866" stroke-width="1" opacity="0.4"/>

      <text x="190" y="475" text-anchor="middle" font-size="20" fill="#ffd866" letter-spacing="2">⇕</text>
      <text x="190" y="540" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffd866">ENERGY</text>
      <text x="190" y="580" text-anchor="middle" font-size="20" font-style="italic" opacity="0.8">conserved</text>
      <text x="190" y="612" text-anchor="middle" font-family="Times New Roman, serif" font-size="20" font-style="italic" fill="#e6edf3" opacity="0.8">E = const</text>
    </g>

    <!-- Column 2: Space -->
    <g transform="translate(770, 280)">
      <rect x="0" y="0" width="380" height="640" fill="#1a212e" rx="14"/>
      <rect x="0" y="0" width="380" height="640" fill="none" stroke="#58a6ff" stroke-width="2" rx="14" opacity="0.6"/>

      <text x="190" y="60" text-anchor="middle" font-size="26" fill="#58a6ff" letter-spacing="3">SYMMETRY</text>

      <!-- Arrow icon -->
      <g transform="translate(190, 200)" stroke="#58a6ff" stroke-width="4" fill="none">
        <line x1="-80" y1="0" x2="80" y2="0"/>
        <polygon points="80,0 60,-12 60,12" fill="#58a6ff"/>
        <line x1="-80" y1="-30" x2="-80" y2="30"/>
        <line x1="80" y1="-30" x2="80" y2="30"/>
      </g>

      <text x="190" y="350" text-anchor="middle" font-size="28" font-weight="bold">Space-translation</text>
      <text x="190" y="385" text-anchor="middle" font-size="20" font-style="italic" opacity="0.8">"here = there"</text>

      <line x1="60" y1="430" x2="320" y2="430" stroke="#ffd866" stroke-width="1" opacity="0.4"/>

      <text x="190" y="475" text-anchor="middle" font-size="20" fill="#ffd866" letter-spacing="2">⇕</text>
      <text x="190" y="540" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffd866">MOMENTUM</text>
      <text x="190" y="580" text-anchor="middle" font-size="20" font-style="italic" opacity="0.8">conserved</text>
      <text x="190" y="612" text-anchor="middle" font-family="Times New Roman, serif" font-size="20" font-style="italic" fill="#e6edf3" opacity="0.8">p = const</text>
    </g>

    <!-- Column 3: Phase -->
    <g transform="translate(1220, 280)">
      <rect x="0" y="0" width="380" height="640" fill="#1a212e" rx="14"/>
      <rect x="0" y="0" width="380" height="640" fill="none" stroke="#58a6ff" stroke-width="2" rx="14" opacity="0.6"/>

      <text x="190" y="60" text-anchor="middle" font-size="26" fill="#58a6ff" letter-spacing="3">SYMMETRY</text>

      <!-- Phase circle / U(1) -->
      <g transform="translate(190, 200)" stroke="#58a6ff" stroke-width="3" fill="none">
        <circle cx="0" cy="0" r="80"/>
        <path d="M0 -80 A80 80 0 0 1 56 -56" stroke="#ffd866" stroke-width="5"/>
        <circle cx="56" cy="-56" r="6" fill="#ffd866"/>
        <text x="0" y="6" text-anchor="middle" font-family="Times New Roman, serif" font-size="34" font-style="italic" fill="#e6edf3" stroke="none">e<tspan baseline-shift="super" font-size="20">iθ</tspan></text>
      </g>

      <text x="190" y="350" text-anchor="middle" font-size="28" font-weight="bold">Phase rotation</text>
      <text x="190" y="385" text-anchor="middle" font-size="20" font-style="italic" opacity="0.8">global U(1)</text>

      <line x1="60" y1="430" x2="320" y2="430" stroke="#ffd866" stroke-width="1" opacity="0.4"/>

      <text x="190" y="475" text-anchor="middle" font-size="20" fill="#ffd866" letter-spacing="2">⇕</text>
      <text x="190" y="540" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffd866">CHARGE</text>
      <text x="190" y="580" text-anchor="middle" font-size="20" font-style="italic" opacity="0.8">conserved</text>
      <text x="190" y="612" text-anchor="middle" font-family="Times New Roman, serif" font-size="20" font-style="italic" fill="#e6edf3" opacity="0.8">Q = const</text>
    </g>
  </g>

  <!-- Footer attribution -->
  <text x="960" y="1010" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#e6edf3" opacity="0.7">Emmy Noether · Göttingen · 1918</text>
</svg>
