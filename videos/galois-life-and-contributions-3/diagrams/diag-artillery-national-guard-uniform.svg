<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg-uniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1117"/>
      <stop offset="1" stop-color="#1a212e"/>
    </linearGradient>
    <linearGradient id="navy-uniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2840"/>
      <stop offset="1" stop-color="#0c1424"/>
    </linearGradient>
    <linearGradient id="gold-uniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c45a"/>
      <stop offset="1" stop-color="#a07a1c"/>
    </linearGradient>
    <linearGradient id="red-uniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8261c"/>
      <stop offset="1" stop-color="#5a1410"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-uniform)"/>

  <!-- Caption -->
  <text x="960" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#e6edf3" letter-spacing="3">ARTILLERY OF THE NATIONAL GUARD</text>
  <text x="960" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#ffd866" opacity="0.8">Paris · 1830 — disbanded December 1830 by royal decree</text>

  <!-- Soldier figure, standing -->
  <g transform="translate(960, 200)">
    <!-- Bicorne hat -->
    <g transform="translate(0, 0)">
      <ellipse cx="0" cy="48" rx="120" ry="38" fill="url(#navy-uniform)"/>
      <ellipse cx="0" cy="48" rx="120" ry="38" fill="none" stroke="#0a1020" stroke-width="3"/>
      <ellipse cx="0" cy="48" rx="120" ry="14" fill="#000" opacity="0.4"/>
      <!-- Cockade -->
      <circle cx="-78" cy="40" r="14" fill="#1c2840"/>
      <circle cx="-78" cy="40" r="9" fill="#a8261c"/>
      <circle cx="-78" cy="40" r="4" fill="#e8c45a"/>
      <!-- Plume -->
      <path d="M-90 36 Q-110 -10 -130 -50 Q-100 -20 -82 25" fill="#a8261c" opacity="0.85"/>
    </g>

    <!-- Head -->
    <ellipse cx="0" cy="120" rx="44" ry="56" fill="#d3b8a0"/>
    <!-- Sideburns -->
    <path d="M-44 124 Q-50 138 -42 156 Q-32 152 -36 138 Z" fill="#3a2814"/>
    <path d="M44 124 Q50 138 42 156 Q32 152 36 138 Z" fill="#3a2814"/>

    <!-- Neck -->
    <rect x="-18" y="170" width="36" height="22" fill="#d3b8a0"/>
    <rect x="-22" y="186" width="44" height="14" fill="#fff" opacity="0.85"/>

    <!-- Coat / torso -->
    <path d="M-130 200 L130 200 L150 470 L-150 470 Z" fill="url(#navy-uniform)"/>
    <!-- Coat lapels -->
    <path d="M-60 200 L-110 320 L-30 420 L-30 200 Z" fill="url(#red-uniform)"/>
    <path d="M60 200 L110 320 L30 420 L30 200 Z" fill="url(#red-uniform)"/>
    <!-- Buttons (gold) -->
    <g fill="url(#gold-uniform)">
      <circle cx="-80" cy="240" r="6"/><circle cx="-80" cy="270" r="6"/>
      <circle cx="-80" cy="300" r="6"/><circle cx="-80" cy="330" r="6"/>
      <circle cx="-80" cy="360" r="6"/><circle cx="-80" cy="390" r="6"/>
      <circle cx="80" cy="240" r="6"/><circle cx="80" cy="270" r="6"/>
      <circle cx="80" cy="300" r="6"/><circle cx="80" cy="330" r="6"/>
      <circle cx="80" cy="360" r="6"/><circle cx="80" cy="390" r="6"/>
    </g>

    <!-- Sash / belt -->
    <rect x="-160" y="430" width="320" height="20" fill="#fff" opacity="0.85"/>
    <rect x="-160" y="450" width="320" height="14" fill="url(#gold-uniform)"/>

    <!-- Trousers -->
    <rect x="-150" y="470" width="300" height="280" fill="#222a3a"/>
    <line x1="0" y1="470" x2="0" y2="750" stroke="#0a0d12" stroke-width="2"/>
    <!-- Red side stripe -->
    <rect x="-152" y="470" width="6" height="280" fill="url(#red-uniform)"/>
    <rect x="146" y="470" width="6" height="280" fill="url(#red-uniform)"/>

    <!-- Boots -->
    <ellipse cx="-70" cy="780" rx="46" ry="20" fill="#0a0d12"/>
    <ellipse cx="70" cy="780" rx="46" ry="20" fill="#0a0d12"/>

    <!-- Sword on left side -->
    <g transform="translate(-160, 480) rotate(-10)">
      <rect x="0" y="0" width="6" height="220" fill="url(#gold-uniform)"/>
      <rect x="-8" y="0" width="22" height="14" fill="url(#gold-uniform)"/>
    </g>

    <!-- Crossed cannon insignia on left chest -->
    <g transform="translate(-30, 280)" stroke="url(#gold-uniform)" stroke-width="2.5" fill="none">
      <line x1="-12" y1="-12" x2="12" y2="12"/>
      <line x1="-12" y1="12" x2="12" y2="-12"/>
      <circle cx="0" cy="0" r="3" fill="url(#gold-uniform)"/>
    </g>
  </g>

  <!-- Side annotations -->
  <g font-family="Georgia, serif" fill="#e6edf3" opacity="0.75">
    <text x="280" y="380" font-size="22" font-style="italic">Bicorne with red plume</text>
    <line x1="500" y1="370" x2="800" y2="270" stroke="#ffd866" stroke-width="1" opacity="0.5"/>

    <text x="280" y="540" font-size="22" font-style="italic">Navy coat with red lapels</text>
    <line x1="540" y1="530" x2="820" y2="430" stroke="#ffd866" stroke-width="1" opacity="0.5"/>

    <text x="1340" y="440" font-size="22" font-style="italic">Crossed-cannon insignia</text>
    <line x1="1330" y1="430" x2="1080" y2="480" stroke="#ffd866" stroke-width="1" opacity="0.5"/>

    <text x="1340" y="640" font-size="22" font-style="italic">Saber and white sash</text>
    <line x1="1330" y1="630" x2="1090" y2="640" stroke="#ffd866" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
