<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg-sm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1117"/>
      <stop offset="1" stop-color="#171c25"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-sm)"/>

  <!-- Title -->
  <text x="960" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#e6edf3" letter-spacing="3">THE STANDARD MODEL</text>
  <text x="960" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#ffd866" opacity="0.85">Three gauge groups · matter as their representations</text>

  <!-- Three group boxes in a row -->
  <g font-family="Georgia, serif">
    <!-- SU(3) -->
    <g transform="translate(220, 280)">
      <rect width="420" height="220" fill="#1a212e" rx="14" stroke="#f97583" stroke-width="3"/>
      <text x="210" y="80" text-anchor="middle" font-size="80" font-weight="bold" fill="#f97583" font-family="Times New Roman, serif" font-style="italic">SU(3)</text>
      <text x="210" y="140" text-anchor="middle" font-size="22" fill="#e6edf3" letter-spacing="2">STRONG FORCE</text>
      <text x="210" y="180" text-anchor="middle" font-size="20" font-style="italic" fill="#e6edf3" opacity="0.75">color · gluons · 8 generators</text>
    </g>

    <!-- SU(2) -->
    <g transform="translate(750, 280)">
      <rect width="420" height="220" fill="#1a212e" rx="14" stroke="#58a6ff" stroke-width="3"/>
      <text x="210" y="80" text-anchor="middle" font-size="80" font-weight="bold" fill="#58a6ff" font-family="Times New Roman, serif" font-style="italic">SU(2)</text>
      <text x="210" y="140" text-anchor="middle" font-size="22" fill="#e6edf3" letter-spacing="2">WEAK FORCE</text>
      <text x="210" y="180" text-anchor="middle" font-size="20" font-style="italic" fill="#e6edf3" opacity="0.75">isospin · W± and Z⁰ · 3 gen.</text>
    </g>

    <!-- U(1) -->
    <g transform="translate(1280, 280)">
      <rect width="420" height="220" fill="#1a212e" rx="14" stroke="#ffd866" stroke-width="3"/>
      <text x="210" y="80" text-anchor="middle" font-size="80" font-weight="bold" fill="#ffd866" font-family="Times New Roman, serif" font-style="italic">U(1)</text>
      <text x="210" y="140" text-anchor="middle" font-size="22" fill="#e6edf3" letter-spacing="2">HYPERCHARGE</text>
      <text x="210" y="180" text-anchor="middle" font-size="20" font-style="italic" fill="#e6edf3" opacity="0.75">phase · photon · 1 generator</text>
    </g>
  </g>

  <!-- Multiplication symbols -->
  <text x="700" y="420" text-anchor="middle" font-family="Times New Roman, serif" font-size="60" fill="#e6edf3" opacity="0.7">×</text>
  <text x="1230" y="420" text-anchor="middle" font-family="Times New Roman, serif" font-size="60" fill="#e6edf3" opacity="0.7">×</text>

  <!-- Lagrangian box, expanded -->
  <g transform="translate(160, 600)">
    <rect width="1600" height="320" fill="#0e1117" rx="14" stroke="#3a4658" stroke-width="2"/>
    <text x="60" y="70" font-family="Georgia, serif" font-size="22" fill="#ffd866" letter-spacing="2">LAGRANGIAN  ℒ_SM  =</text>

    <g transform="translate(80, 130)" font-family="Times New Roman, serif" font-style="italic" fill="#e6edf3">
      <text font-size="38">−¼ G<tspan baseline-shift="sub" font-size="22">μν</tspan>ᵃ G<tspan baseline-shift="super" font-size="22">μν a</tspan></text>
      <text x="380" y="0" font-size="38" fill="#f97583">[ SU(3) ]</text>

      <text x="600" y="0" font-size="38">−¼ W<tspan baseline-shift="sub" font-size="22">μν</tspan>ⁱ W<tspan baseline-shift="super" font-size="22">μν i</tspan></text>
      <text x="980" y="0" font-size="38" fill="#58a6ff">[ SU(2) ]</text>

      <text x="1200" y="0" font-size="38">−¼ B<tspan baseline-shift="sub" font-size="22">μν</tspan> B<tspan baseline-shift="super" font-size="22">μν</tspan></text>
      <text x="1430" y="0" font-size="38" fill="#ffd866">[ U(1) ]</text>

      <text x="0" y="80" font-size="38">+ ψ̄  i γ<tspan baseline-shift="super" font-size="22">μ</tspan> D<tspan baseline-shift="sub" font-size="22">μ</tspan> ψ  −  m ψ̄ ψ  +  ( D<tspan baseline-shift="sub" font-size="22">μ</tspan> φ )<tspan baseline-shift="super" font-size="22">†</tspan> ( D<tspan baseline-shift="super" font-size="22">μ</tspan> φ )  −  V( φ )</text>
    </g>
  </g>

  <text x="960" y="1010" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#e6edf3" opacity="0.7">A Galois-style story: matter sits inside the representations of three groups</text>
</svg>
