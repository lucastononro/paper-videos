<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky-bastille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a3a"/>
      <stop offset="0.6" stop-color="#3a3548"/>
      <stop offset="1" stop-color="#5a4030"/>
    </linearGradient>
    <linearGradient id="ground-bastille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#1a0e08"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="700" fill="url(#sky-bastille)"/>
  <rect x="0" y="700" width="1920" height="380" fill="url(#ground-bastille)"/>

  <!-- July Column silhouette in distance -->
  <g transform="translate(960, 600)">
    <rect x="-20" y="-440" width="40" height="440" fill="#0a0d12"/>
    <rect x="-32" y="-460" width="64" height="20" fill="#0a0d12"/>
    <rect x="-50" y="0" width="100" height="40" fill="#0a0d12"/>
    <!-- Génie figure on top -->
    <g transform="translate(0, -480)" fill="url(#sky-bastille)" stroke="#ffd866" stroke-width="0.5" opacity="0.85">
      <ellipse cx="0" cy="0" rx="8" ry="14"/>
      <path d="M-20 -10 L20 -10 L0 -40 Z" fill="#ffd866" opacity="0.75"/>
      <path d="M-22 -2 L22 -2 L18 30 L-18 30 Z"/>
    </g>
  </g>

  <!-- Crowd / lone figure -->
  <g fill="#0a0d12">
    <!-- Crowd far back -->
    <g opacity="0.7">
      <circle cx="200" cy="780" r="14"/><rect x="186" y="794" width="28" height="60"/>
      <circle cx="260" cy="788" r="13"/><rect x="247" y="801" width="26" height="58"/>
      <circle cx="320" cy="784" r="14"/><rect x="306" y="798" width="28" height="60"/>
      <circle cx="380" cy="788" r="13"/><rect x="367" y="801" width="26" height="58"/>
      <circle cx="1540" cy="780" r="14"/><rect x="1526" y="794" width="28" height="60"/>
      <circle cx="1600" cy="788" r="13"/><rect x="1587" y="801" width="26" height="58"/>
      <circle cx="1660" cy="784" r="14"/><rect x="1646" y="798" width="28" height="60"/>
    </g>

    <!-- Lone Galois figure, foreground -->
    <g transform="translate(960, 850)">
      <!-- Bicorne -->
      <ellipse cx="0" cy="-130" rx="44" ry="12" fill="#1c2840"/>
      <!-- Head -->
      <ellipse cx="0" cy="-100" rx="20" ry="26" fill="#d3b8a0"/>
      <!-- Coat -->
      <path d="M-50 -70 L50 -70 L60 100 L-60 100 Z" fill="#1c2840"/>
      <!-- Buttons -->
      <g fill="#e8c45a">
        <circle cx="-20" cy="-50" r="3"/><circle cx="-20" cy="-25" r="3"/>
        <circle cx="-20" cy="0" r="3"/><circle cx="-20" cy="25" r="3"/>
        <circle cx="-20" cy="50" r="3"/>
        <circle cx="20" cy="-50" r="3"/><circle cx="20" cy="-25" r="3"/>
        <circle cx="20" cy="0" r="3"/><circle cx="20" cy="25" r="3"/>
        <circle cx="20" cy="50" r="3"/>
      </g>
      <!-- Sash -->
      <rect x="-60" y="60" width="120" height="14" fill="#fff" opacity="0.85"/>
      <!-- Trousers -->
      <rect x="-50" y="100" width="100" height="120" fill="#0a0d12"/>
      <!-- Rifle on shoulder -->
      <line x1="40" y1="-90" x2="120" y2="180" stroke="#3a2814" stroke-width="6"/>
      <line x1="40" y1="-90" x2="120" y2="180" stroke="#5a3a1c" stroke-width="2"/>
      <!-- Pistol at belt -->
      <rect x="-58" y="76" width="20" height="10" fill="#0a0d12"/>
      <rect x="38" y="76" width="20" height="10" fill="#0a0d12"/>
      <!-- Dagger handle -->
      <rect x="-2" y="74" width="4" height="20" fill="#3a2814"/>
    </g>
  </g>

  <!-- Caption -->
  <text x="960" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#e6edf3" letter-spacing="3">BASTILLE DAY · JULY 14, 1831</text>
  <text x="960" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#ffd866" opacity="0.85">Galois walks Paris in the now-illegal Artillery uniform</text>
</svg>
