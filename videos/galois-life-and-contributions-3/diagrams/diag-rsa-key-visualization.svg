<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg-rsa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1117"/>
      <stop offset="1" stop-color="#171c25"/>
    </linearGradient>
    <linearGradient id="lock-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9d96a"/>
      <stop offset="1" stop-color="#a07a1c"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-rsa)"/>

  <text x="960" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#e6edf3" letter-spacing="3">PUBLIC-KEY CRYPTOGRAPHY</text>
  <text x="960" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#ffd866" opacity="0.85">RSA · Diffie-Hellman · elliptic curves  —  arithmetic in finite groups</text>

  <!-- Padlock icon -->
  <g transform="translate(960, 540)">
    <!-- Shackle -->
    <path d="M-110 -40 L-110 -150 Q-110 -250 0 -250 Q110 -250 110 -150 L110 -40" stroke="url(#lock-gold)" stroke-width="36" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-180" y="-40" width="360" height="280" rx="34" fill="url(#lock-gold)" stroke="#3a2614" stroke-width="3"/>
    <!-- Keyhole -->
    <circle cx="0" cy="80" r="26" fill="#0e1117"/>
    <rect x="-10" y="80" width="20" height="80" fill="#0e1117"/>
  </g>

  <!-- Hex stream of digits — left -->
