  <g font-family="Times New Roman, serif" font-style="italic" fill="#e6edf3">
    <text x="960" y="900" text-anchor="middle" font-size="34">c = m<tspan baseline-shift="super" font-size="22">e</tspan>  mod  N</text>
    <text x="960" y="950" text-anchor="middle" font-size="22" fill="#ffd866" opacity="0.85">multiplication in (ℤ/Nℤ)*  —  a finite abelian group</text>
