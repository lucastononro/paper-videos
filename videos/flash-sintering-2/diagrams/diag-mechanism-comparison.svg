<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="46" fill="#e6edf3" text-anchor="middle" font-weight="700">The mechanism war</text>
  <text x="960" y="124" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">two camps, same experiment</text>

  <!-- left side -->
  <g>
    <rect x="80" y="180" width="850" height="800" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="505" y="240" font-family="Inter, sans-serif" font-size="32" fill="#58a6ff" text-anchor="middle" font-weight="700">Joule-only camp</text>
    <text x="505" y="280" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">Todd · Hewitt · Dong · I-Wei Chen</text>

    <text x="120" y="360" font-family="Inter, sans-serif" font-size="22" fill="#e6edf3" font-weight="700">Claim:</text>
    <text x="120" y="395" font-family="Inter, sans-serif" font-size="22" fill="#e6edf3">Flash = thermal runaway, full stop.</text>

    <text x="120" y="465" font-family="Inter, sans-serif" font-size="22" fill="#ffd866" font-weight="700">Evidence:</text>
    <text x="120" y="500" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• f(θ) vs g(θ) tangency fits onset to within volts</text>
    <text x="120" y="535" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• Local hot-spots at grain contacts</text>
    <text x="120" y="570" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• In-situ pyrometry → 1900–2200 K core</text>
    <text x="120" y="605" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• Diffusion rates match what you’d expect at T_core</text>
    <text x="120" y="640" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• &gt;12 materials follow the same onset criterion</text>

    <text x="120" y="710" font-family="Inter, sans-serif" font-size="22" fill="#f97583" font-weight="700">Achilles heel:</text>
    <text x="120" y="745" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Why do samples in Ar look different from samples in air?</text>
    <text x="120" y="775" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Why do some come out black instead of grey?</text>

    <text x="505" y="900" font-family="Inter, sans-serif" font-size="26" fill="#58a6ff" text-anchor="middle" font-weight="700">"measure T properly, mystery dissolves"</text>
  </g>

  <!-- divider -->
  <line x1="960" y1="220" x2="960" y2="960" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- right side -->
  <g>
    <rect x="990" y="180" width="850" height="800" rx="14" fill="#161b22" stroke="#ff8c42" stroke-width="3"/>
    <text x="1415" y="240" font-family="Inter, sans-serif" font-size="32" fill="#ff8c42" text-anchor="middle" font-weight="700">Defect / electrochemical camp</text>
    <text x="1415" y="280" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">Raj · Naik · Cologna · Sglavo · Biesuz</text>

    <text x="1030" y="360" font-family="Inter, sans-serif" font-size="22" fill="#e6edf3" font-weight="700">Claim:</text>
    <text x="1030" y="395" font-family="Inter, sans-serif" font-size="22" fill="#e6edf3">Field-driven Frenkel-pair avalanches; not just heat.</text>

    <text x="1030" y="465" font-family="Inter, sans-serif" font-size="22" fill="#ffd866" font-weight="700">Evidence:</text>
    <text x="1030" y="500" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• Blackbody T too low for observed densification</text>
    <text x="1030" y="535" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• Color change: samples come out black, not grey</text>
    <text x="1030" y="570" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• Atmosphere matters (Ar vs air → different μ-structures)</text>
    <text x="1030" y="605" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• Localized reduction at the cathode</text>
    <text x="1030" y="640" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">• Vacancy–interstitial cascades, field-mediated</text>

    <text x="1030" y="710" font-family="Inter, sans-serif" font-size="22" fill="#f97583" font-weight="700">Achilles heel:</text>
    <text x="1030" y="745" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">No direct measurement of defect concentration</text>
    <text x="1030" y="775" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">vs. uncertainty bars on T_core leave it ambiguous</text>

    <text x="1415" y="900" font-family="Inter, sans-serif" font-size="26" fill="#ff8c42" text-anchor="middle" font-weight="700">"the heat alone cannot do it"</text>
  </g>

  <text x="960" y="1030" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">15 years later — still no killing measurement.</text>
</svg>
