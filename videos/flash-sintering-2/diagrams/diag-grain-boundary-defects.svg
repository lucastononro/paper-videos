<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="46" fill="#e6edf3" text-anchor="middle" font-weight="700">Frenkel-pair avalanches at grain boundaries</text>
  <text x="960" y="122" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">vacancy + interstitial pairs, generated by the field</text>

  <!-- Grain layout: 3 large grains -->
  <g>
    <!-- grain 1 -->
    <path d="M 250 220 L 760 220 L 800 540 L 700 760 L 250 740 L 230 460 Z" fill="#1c2330" stroke="#58a6ff" stroke-width="3"/>
    <!-- grain 2 -->
    <path d="M 760 220 L 1280 240 L 1340 540 L 1280 780 L 700 760 L 800 540 Z" fill="#1c2330" stroke="#58a6ff" stroke-width="3"/>
    <!-- grain 3 -->
    <path d="M 1280 240 L 1700 220 L 1690 540 L 1620 760 L 1280 780 L 1340 540 Z" fill="#1c2330" stroke="#58a6ff" stroke-width="3"/>

    <!-- Lattice dots inside grain 1 -->
    <g fill="#3a4858">
      <circle cx="320" cy="320" r="6"/><circle cx="380" cy="320" r="6"/><circle cx="440" cy="320" r="6"/><circle cx="500" cy="320" r="6"/><circle cx="560" cy="320" r="6"/><circle cx="620" cy="320" r="6"/><circle cx="680" cy="320" r="6"/>
      <circle cx="320" cy="390" r="6"/><circle cx="380" cy="390" r="6"/><circle cx="440" cy="390" r="6"/><circle cx="500" cy="390" r="6"/><circle cx="560" cy="390" r="6"/><circle cx="620" cy="390" r="6"/><circle cx="680" cy="390" r="6"/>
      <circle cx="320" cy="460" r="6"/><circle cx="380" cy="460" r="6"/><circle cx="440" cy="460" r="6"/><circle cx="500" cy="460" r="6"/><circle cx="560" cy="460" r="6"/><circle cx="620" cy="460" r="6"/><circle cx="680" cy="460" r="6"/>
      <circle cx="320" cy="530" r="6"/><circle cx="380" cy="530" r="6"/><circle cx="440" cy="530" r="6"/><circle cx="500" cy="530" r="6"/><circle cx="560" cy="530" r="6"/><circle cx="620" cy="530" r="6"/><circle cx="680" cy="530" r="6"/>
      <circle cx="320" cy="600" r="6"/><circle cx="380" cy="600" r="6"/><circle cx="440" cy="600" r="6"/><circle cx="500" cy="600" r="6"/><circle cx="560" cy="600" r="6"/><circle cx="620" cy="600" r="6"/><circle cx="680" cy="600" r="6"/>
      <circle cx="320" cy="670" r="6"/><circle cx="380" cy="670" r="6"/><circle cx="440" cy="670" r="6"/><circle cx="500" cy="670" r="6"/><circle cx="560" cy="670" r="6"/><circle cx="620" cy="670" r="6"/><circle cx="680" cy="670" r="6"/>
    </g>
    <!-- Lattice in grain 2 -->
    <g fill="#3a4858">
      <circle cx="880" cy="340" r="6"/><circle cx="940" cy="340" r="6"/><circle cx="1000" cy="340" r="6"/><circle cx="1060" cy="340" r="6"/><circle cx="1120" cy="340" r="6"/><circle cx="1180" cy="340" r="6"/><circle cx="1240" cy="340" r="6"/>
      <circle cx="880" cy="410" r="6"/><circle cx="940" cy="410" r="6"/><circle cx="1000" cy="410" r="6"/><circle cx="1060" cy="410" r="6"/><circle cx="1120" cy="410" r="6"/><circle cx="1180" cy="410" r="6"/><circle cx="1240" cy="410" r="6"/>
      <circle cx="880" cy="480" r="6"/><circle cx="940" cy="480" r="6"/><circle cx="1000" cy="480" r="6"/><circle cx="1060" cy="480" r="6"/><circle cx="1120" cy="480" r="6"/><circle cx="1180" cy="480" r="6"/><circle cx="1240" cy="480" r="6"/>
      <circle cx="880" cy="550" r="6"/><circle cx="940" cy="550" r="6"/><circle cx="1000" cy="550" r="6"/><circle cx="1060" cy="550" r="6"/><circle cx="1120" cy="550" r="6"/><circle cx="1180" cy="550" r="6"/><circle cx="1240" cy="550" r="6"/>
      <circle cx="880" cy="620" r="6"/><circle cx="940" cy="620" r="6"/><circle cx="1000" cy="620" r="6"/><circle cx="1060" cy="620" r="6"/><circle cx="1120" cy="620" r="6"/><circle cx="1180" cy="620" r="6"/><circle cx="1240" cy="620" r="6"/>
      <circle cx="880" cy="690" r="6"/><circle cx="940" cy="690" r="6"/><circle cx="1000" cy="690" r="6"/><circle cx="1060" cy="690" r="6"/><circle cx="1120" cy="690" r="6"/><circle cx="1180" cy="690" r="6"/><circle cx="1240" cy="690" r="6"/>
    </g>
    <!-- Lattice in grain 3 -->
    <g fill="#3a4858">
      <circle cx="1410" cy="320" r="6"/><circle cx="1470" cy="320" r="6"/><circle cx="1530" cy="320" r="6"/><circle cx="1590" cy="320" r="6"/><circle cx="1650" cy="320" r="6"/>
      <circle cx="1410" cy="390" r="6"/><circle cx="1470" cy="390" r="6"/><circle cx="1530" cy="390" r="6"/><circle cx="1590" cy="390" r="6"/><circle cx="1650" cy="390" r="6"/>
      <circle cx="1410" cy="460" r="6"/><circle cx="1470" cy="460" r="6"/><circle cx="1530" cy="460" r="6"/><circle cx="1590" cy="460" r="6"/><circle cx="1650" cy="460" r="6"/>
      <circle cx="1410" cy="530" r="6"/><circle cx="1470" cy="530" r="6"/><circle cx="1530" cy="530" r="6"/><circle cx="1590" cy="530" r="6"/><circle cx="1650" cy="530" r="6"/>
      <circle cx="1410" cy="600" r="6"/><circle cx="1470" cy="600" r="6"/><circle cx="1530" cy="600" r="6"/><circle cx="1590" cy="600" r="6"/><circle cx="1650" cy="600" r="6"/>
      <circle cx="1410" cy="670" r="6"/><circle cx="1470" cy="670" r="6"/><circle cx="1530" cy="670" r="6"/><circle cx="1590" cy="670" r="6"/><circle cx="1650" cy="670" r="6"/>
    </g>

    <!-- Vacancies (empty rings) -->
    <g fill="none" stroke="#f97583" stroke-width="3">
      <circle cx="500" cy="460" r="11"/>
      <circle cx="1060" cy="480" r="11"/>
      <circle cx="1530" cy="530" r="11"/>
      <circle cx="440" cy="600" r="11"/>
      <circle cx="940" cy="620" r="11"/>
    </g>

    <!-- Interstitials (yellow extra dots near lattice) -->
    <g fill="#ffd866">
      <circle cx="530" cy="420" r="9"/>
      <circle cx="1090" cy="440" r="9"/>
      <circle cx="1500" cy="490" r="9"/>
      <circle cx="470" cy="640" r="9"/>
      <circle cx="970" cy="580" r="9"/>
    </g>

    <!-- Connection lines vacancy ↔ interstitial (Frenkel pairs) -->
    <g stroke="#ff8c42" stroke-width="2" stroke-dasharray="3 4" opacity="0.7">
      <line x1="500" y1="460" x2="530" y2="420"/>
      <line x1="1060" y1="480" x2="1090" y2="440"/>
      <line x1="1530" y1="530" x2="1500" y2="490"/>
      <line x1="440" y1="600" x2="470" y2="640"/>
      <line x1="940" y1="620" x2="970" y2="580"/>
    </g>

    <!-- E-field arrow across the picture -->
    <line x1="240" y1="180" x2="1700" y2="180" stroke="#58a6ff" stroke-width="3"/>
    <polygon points="1700,170 1720,180 1700,190" fill="#58a6ff"/>
    <text x="970" y="170" font-family="Inter, sans-serif" font-size="22" fill="#58a6ff" text-anchor="middle">Electric field E ⟶</text>
  </g>

  <!-- Legend -->
  <g transform="translate(160, 870)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="22" fill="#e6edf3" font-weight="700">Legend</text>

    <circle cx="20" cy="40" r="6" fill="#3a4858"/>
    <text x="42" y="46" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">lattice ion</text>

    <circle cx="220" cy="40" r="11" fill="none" stroke="#f97583" stroke-width="3"/>
    <text x="242" y="46" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">vacancy (empty site)</text>

    <circle cx="540" cy="40" r="9" fill="#ffd866"/>
    <text x="562" y="46" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">interstitial (extra ion)</text>

    <line x1="840" y1="40" x2="900" y2="40" stroke="#ff8c42" stroke-width="2" stroke-dasharray="3 4"/>
    <text x="912" y="46" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Frenkel pair</text>
  </g>

  <text x="960" y="1010" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Field-driven cascade fills the lattice with hop-sites; atoms move not because they are hot, but because there is somewhere to go.</text>
</svg>
