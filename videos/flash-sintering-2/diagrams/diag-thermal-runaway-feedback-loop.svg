<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="46" fill="#e6edf3" text-anchor="middle" font-weight="700">The thermal-runaway feedback loop</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">five small steps; one positive-feedback loop</text>

  <!-- Center circle showing the loop -->
  <g>
    <!-- ring -->
    <circle cx="960" cy="580" r="320" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 8"/>

    <!-- 5 nodes on the ring -->
    <!-- Node positions: angles 270, 270+72=342, 54, 126, 198 -->
    <!-- Node 1 (top) — Voltage applied -->
    <g transform="translate(960, 260)">
      <rect x="-140" y="-40" width="280" height="80" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
      <text x="0" y="-6" font-family="Inter, sans-serif" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">1. Voltage V applied</text>
      <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">across the disc</text>
    </g>

    <!-- Node 2 (upper-right) — Current flows -->
    <g transform="translate(1264, 480)">
      <rect x="-140" y="-40" width="280" height="80" rx="14" fill="#161b22" stroke="#ffd866" stroke-width="3"/>
      <text x="0" y="-6" font-family="Inter, sans-serif" font-size="22" fill="#ffd866" text-anchor="middle" font-weight="700">2. Current I flows</text>
      <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">I = σ(T) · V/L</text>
    </g>

    <!-- Node 3 (lower-right) — Joule heating -->
    <g transform="translate(1148, 820)">
      <rect x="-140" y="-40" width="280" height="80" rx="14" fill="#161b22" stroke="#f97583" stroke-width="3"/>
      <text x="0" y="-6" font-family="Inter, sans-serif" font-size="22" fill="#f97583" text-anchor="middle" font-weight="700">3. Joule heating</text>
      <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">P = I²R</text>
    </g>

    <!-- Node 4 (lower-left) — Temperature rises -->
    <g transform="translate(772, 820)">
      <rect x="-140" y="-40" width="280" height="80" rx="14" fill="#161b22" stroke="#f97583" stroke-width="3"/>
      <text x="0" y="-6" font-family="Inter, sans-serif" font-size="22" fill="#f97583" text-anchor="middle" font-weight="700">4. T rises</text>
      <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="20" fill="#e6edf3" text-anchor="middle">dT/dt &gt; 0</text>
    </g>

    <!-- Node 5 (upper-left) — Conductivity rises -->
    <g transform="translate(656, 480)">
      <rect x="-140" y="-40" width="280" height="80" rx="14" fill="#161b22" stroke="#ffd866" stroke-width="3"/>
      <text x="0" y="-6" font-family="Inter, sans-serif" font-size="22" fill="#ffd866" text-anchor="middle" font-weight="700">5. σ(T) rises</text>
      <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="18" fill="#e6edf3" text-anchor="middle">σ = Ae^(-E/RT)</text>
    </g>

    <!-- Arrows along the ring -->
    <!-- 1 -> 2 -->
    <path d="M 1100 320 A 320 320 0 0 1 1268 460" fill="none" stroke="#e6edf3" stroke-width="3" marker-end="url(#arrowEnd)"/>
    <!-- 2 -> 3 -->
    <path d="M 1264 520 A 320 320 0 0 1 1175 805" fill="none" stroke="#e6edf3" stroke-width="3" marker-end="url(#arrowEnd)"/>
    <!-- 3 -> 4 -->
    <path d="M 1000 880 A 320 320 0 0 1 905 880" fill="none" stroke="#e6edf3" stroke-width="3" marker-end="url(#arrowEnd)"/>
    <!-- 4 -> 5 -->
    <path d="M 740 805 A 320 320 0 0 1 660 520" fill="none" stroke="#e6edf3" stroke-width="3" marker-end="url(#arrowEnd)"/>
    <!-- 5 -> back-to-2 (the runaway: higher σ at same V means more I) -->
    <path d="M 660 460 A 320 320 0 0 1 820 320" fill="none" stroke="#e6edf3" stroke-width="3" marker-end="url(#arrowEnd)"/>

    <!-- arrowhead marker -->
    <defs>
      <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0 0, 10 5, 0 10" fill="#e6edf3"/>
      </marker>
    </defs>

    <!-- Center label -->
    <text x="960" y="560" font-family="Inter, sans-serif" font-size="44" fill="#ff8c42" text-anchor="middle" font-weight="700">RUNAWAY</text>
    <text x="960" y="610" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">positive-feedback</text>
  </g>

  <text x="960" y="1015" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Each loop iteration: T ↑ → σ ↑ → I ↑ at constant V → P=I²R ↑ → T ↑↑</text>
</svg>
