<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="44" fill="#e6edf3" text-anchor="middle" font-weight="700">Flash sintering — circuit setup</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">zirconia disc in a tube furnace, voltage applied across electrodes</text>

  <!-- furnace tube -->
  <rect x="300" y="380" width="900" height="320" rx="40" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <text x="750" y="370" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">tube furnace, ~850 °C</text>
  <!-- furnace heating coils -->
  <g stroke="#f97583" stroke-width="2" fill="none" opacity="0.6">
    <path d="M340 410 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0"/>
    <path d="M340 680 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0"/>
  </g>

  <!-- top electrode -->
  <rect x="700" y="450" width="100" height="20" fill="#c9d1d9" stroke="#e6edf3" stroke-width="2"/>
  <text x="820" y="465" font-family="Inter, sans-serif" font-size="20" fill="#e6edf3">Pt electrode</text>
  <!-- disc -->
  <ellipse cx="750" cy="540" rx="120" ry="40" fill="#3a3a3a" stroke="#8b949e" stroke-width="3"/>
  <ellipse cx="750" cy="540" rx="120" ry="10" fill="#2a2a2a"/>
  <text x="900" y="540" font-family="Inter, sans-serif" font-size="20" fill="#e6edf3">zirconia disc (3% Y₂O₃)</text>
  <text x="900" y="565" font-family="Inter, sans-serif" font-size="16" fill="#8b949e">~3 mm thick</text>
  <!-- bottom electrode -->
  <rect x="700" y="610" width="100" height="20" fill="#c9d1d9" stroke="#e6edf3" stroke-width="2"/>
  <text x="820" y="625" font-family="Inter, sans-serif" font-size="20" fill="#e6edf3">Pt electrode</text>

  <!-- wires going out -->
  <line x1="750" y1="450" x2="750" y2="200" stroke="#ffd866" stroke-width="3"/>
  <line x1="750" y1="200" x2="1400" y2="200" stroke="#ffd866" stroke-width="3"/>
  <line x1="750" y1="630" x2="750" y2="880" stroke="#ffd866" stroke-width="3"/>
  <line x1="750" y1="880" x2="1400" y2="880" stroke="#ffd866" stroke-width="3"/>

  <!-- power supply box -->
  <rect x="1380" y="450" width="320" height="180" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
  <text x="1540" y="500" font-family="Inter, sans-serif" font-size="26" fill="#58a6ff" text-anchor="middle" font-weight="700">DC supply</text>
  <text x="1540" y="540" font-family="JetBrains Mono, monospace" font-size="34" fill="#ffd866" text-anchor="middle">V = 120 V</text>
  <text x="1540" y="585" font-family="JetBrains Mono, monospace" font-size="22" fill="#e6edf3" text-anchor="middle">I-limit ≈ 1 A/cm²</text>
  <!-- supply leads -->
  <line x1="1400" y1="200" x2="1400" y2="450" stroke="#ffd866" stroke-width="3"/>
  <line x1="1400" y1="630" x2="1400" y2="880" stroke="#ffd866" stroke-width="3"/>

  <!-- ammeter -->
  <circle cx="1100" cy="200" r="36" fill="#0e1117" stroke="#58a6ff" stroke-width="3"/>
  <text x="1100" y="210" font-family="Inter, sans-serif" font-size="28" fill="#58a6ff" text-anchor="middle" font-weight="700">A</text>

  <!-- labels for measurements -->
  <text x="960" y="975" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">log current I(t) and voltage V(t) recorded continuously</text>
</svg>
