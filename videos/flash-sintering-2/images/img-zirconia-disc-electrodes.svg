<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">YSZ disc with platinum electrodes</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">3 mol% yttria-stabilized zirconia, ≈ 3 mm thick, ≈ 10 mm diameter</text>

  <!-- 3D-ish disc -->
  <g transform="translate(960, 580)">
    <!-- top electrode plate -->
    <ellipse cx="0" cy="-120" rx="260" ry="36" fill="#c9d1d9" stroke="#8b949e" stroke-width="2"/>
    <text x="290" y="-115" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Pt electrode</text>
    <line x1="220" y1="-130" x2="285" y2="-128" stroke="#c9d1d9" stroke-width="2"/>

    <!-- side of top electrode -->
    <path d="M -260 -120 L -260 -100 A 260 36 0 0 0 260 -100 L 260 -120 Z" fill="#a0a8b4" stroke="#8b949e" stroke-width="2"/>

    <!-- zirconia disc body -->
    <path d="M -260 -100 L -260 100 A 260 36 0 0 0 260 100 L 260 -100 A 260 36 0 0 1 -260 -100 Z" fill="#888888" stroke="#5a5a5a" stroke-width="2"/>
    <ellipse cx="0" cy="-100" rx="260" ry="36" fill="#9a9a9a" stroke="#5a5a5a" stroke-width="2"/>

    <!-- bottom electrode -->
    <path d="M -260 100 L -260 120 A 260 36 0 0 0 260 120 L 260 100 Z" fill="#a0a8b4" stroke="#8b949e" stroke-width="2"/>
    <ellipse cx="0" cy="120" rx="260" ry="36" fill="#c9d1d9" stroke="#8b949e" stroke-width="2"/>
    <text x="290" y="125" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Pt electrode</text>
    <line x1="220" y1="125" x2="285" y2="125" stroke="#c9d1d9" stroke-width="2"/>

    <!-- size annotations -->
    <line x1="-280" y1="-100" x2="-280" y2="100" stroke="#58a6ff" stroke-width="2"/>
    <line x1="-290" y1="-100" x2="-270" y2="-100" stroke="#58a6ff" stroke-width="2"/>
    <line x1="-290" y1="100" x2="-270" y2="100" stroke="#58a6ff" stroke-width="2"/>
    <text x="-300" y="0" font-family="JetBrains Mono, monospace" font-size="20" fill="#58a6ff" text-anchor="end">~3 mm</text>

    <line x1="-260" y1="180" x2="260" y2="180" stroke="#58a6ff" stroke-width="2"/>
    <line x1="-260" y1="170" x2="-260" y2="190" stroke="#58a6ff" stroke-width="2"/>
    <line x1="260" y1="170" x2="260" y2="190" stroke="#58a6ff" stroke-width="2"/>
    <text x="0" y="220" font-family="JetBrains Mono, monospace" font-size="20" fill="#58a6ff" text-anchor="middle">10 mm dia.</text>
  </g>

  <text x="960" y="990" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">A small puck. One voltage. The standard ionic conductor.</text>
</svg>
