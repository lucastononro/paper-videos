<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#ff8c42" text-anchor="middle" font-weight="700">MnCo₂O₄ — manganese-cobalt spinel</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">flashes at 325 °C. A hot oven.</text>

  <!-- dark blue-black sample -->
  <g transform="translate(720, 600)">
    <ellipse cx="0" cy="220" rx="200" ry="22" fill="#000" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="200" ry="200" fill="#1a2030" stroke="#0a0e15" stroke-width="3"/>
    <ellipse cx="-50" cy="-50" rx="55" ry="28" fill="#445078" opacity="0.45"/>
    <text x="0" y="-240" font-family="JetBrains Mono, monospace" font-size="22" fill="#ff8c42" text-anchor="middle">spinel · AB₂O₄</text>
  </g>

  <!-- thermometer comparison -->
  <g transform="translate(1320, 600)">
    <text x="0" y="-220" font-family="Inter, sans-serif" font-size="22" fill="#c9d1d9" text-anchor="middle" font-weight="700">flash threshold</text>

    <!-- thermometer body -->
    <rect x="-30" y="-180" width="60" height="380" rx="20" fill="#1a1d24" stroke="#30363d" stroke-width="2"/>
    <circle cx="0" cy="220" r="55" fill="#1a1d24" stroke="#30363d" stroke-width="2"/>
    <!-- mercury (red) -->
    <circle cx="0" cy="220" r="42" fill="#f97583"/>
    <rect x="-15" y="100" width="30" height="120" fill="#f97583"/>
    <!-- ticks -->
    <g stroke="#8b949e" stroke-width="1" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e">
      <line x1="35" y1="-150" x2="50" y2="-150"/><text x="60" y="-145">1700 °C</text>
      <line x1="35" y1="-100" x2="50" y2="-100"/><text x="60" y="-95">1450 °C</text>
      <line x1="35" y1="-30" x2="50" y2="-30"/><text x="60" y="-25">850 °C (YSZ)</text>
      <line x1="35" y1="50" x2="50" y2="50"/><text x="60" y="55">600 °C (ZnO)</text>
      <line x1="35" y1="100" x2="60" y2="100" stroke="#ff8c42" stroke-width="3"/><text x="70" y="105" fill="#ff8c42" font-weight="700">325 °C ← here</text>
      <line x1="35" y1="160" x2="50" y2="160"/><text x="60" y="165">25 °C</text>
    </g>
  </g>

  <text x="960" y="990" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">Bondino, Sglavo et al. — the lowest-temperature flash on record</text>
</svg>
