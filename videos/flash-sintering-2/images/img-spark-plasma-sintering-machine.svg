<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Spark plasma sintering (SPS) machine</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">graphite die · uniaxial press · pulsed DC current</text>

  <!-- main rig -->
  <g transform="translate(960, 600)">
    <!-- frame -->
    <rect x="-280" y="-340" width="560" height="680" rx="14" fill="#1a1d24" stroke="#30363d" stroke-width="3"/>
    <!-- top cylinder (ram) -->
    <rect x="-60" y="-340" width="120" height="220" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="2"/>
    <!-- top ram piston -->
    <rect x="-100" y="-120" width="200" height="40" fill="#888" stroke="#444" stroke-width="2"/>
    <!-- graphite die in middle -->
    <rect x="-140" y="-80" width="280" height="160" fill="#1a1a1a" stroke="#444" stroke-width="3"/>
    <!-- glow inside die -->
    <rect x="-110" y="-50" width="220" height="100" fill="#a04a18"/>
    <rect x="-90" y="-30" width="180" height="60" fill="#ffa040" opacity="0.85"/>
    <rect x="-60" y="-15" width="120" height="30" fill="#ffd866" opacity="0.7"/>
    <!-- bottom ram -->
    <rect x="-100" y="80" width="200" height="40" fill="#888" stroke="#444" stroke-width="2"/>
    <rect x="-60" y="120" width="120" height="220" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="2"/>

    <!-- side electrodes / current cables -->
    <g stroke="#ff8c42" stroke-width="6" fill="none">
      <line x1="-160" y1="-100" x2="-260" y2="-100"/>
      <line x1="160" y1="100" x2="260" y2="100"/>
    </g>

    <!-- pulse pattern indicator -->
    <g transform="translate(-200, -220)">
      <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="16" fill="#ff8c42">DC pulse</text>
      <polyline points="0,12 10,12 10,0 24,0 24,12 34,12 34,0 48,0 48,12 58,12 58,0 72,0 72,12 82,12" fill="none" stroke="#ff8c42" stroke-width="2"/>
    </g>

    <!-- pressure arrow -->
    <g transform="translate(0, -360)">
      <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="16" fill="#58a6ff" text-anchor="middle">Pressure ≈ 50 MPa</text>
      <line x1="0" y1="6" x2="0" y2="20" stroke="#58a6ff" stroke-width="3"/>
      <polygon points="-6,16 0,28 6,16" fill="#58a6ff"/>
    </g>
  </g>

  <text x="960" y="990" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">Older sister technique — high pulsed current + uniaxial pressure. Densifies even alumina.</text>
</svg>
