<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#f97583" text-anchor="middle" font-weight="700">Al₂O₃ — alumina · refuses</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">flat Arrhenius curve · 12 V/mm and 1200 °C — nothing.</text>

  <!-- white disc, sad -->
  <g transform="translate(540, 600)">
    <ellipse cx="0" cy="220" rx="200" ry="22" fill="#000" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="200" ry="200" fill="#ffffff" stroke="#bbb" stroke-width="3"/>
    <ellipse cx="-50" cy="-50" rx="60" ry="30" fill="#fff" opacity="0.6"/>
    <text x="0" y="-250" font-family="JetBrains Mono, monospace" font-size="22" fill="#f97583" text-anchor="middle">Al₂O₃ disc — green body, never densified</text>
  </g>

  <!-- right: σ vs T plot, flat -->
  <g transform="translate(1140, 360)">
    <rect x="0" y="0" width="640" height="440" fill="#10141b" stroke="#30363d" stroke-width="2"/>
    <text x="320" y="-12" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9" text-anchor="middle">log σ vs 1/T</text>
    <!-- axes -->
    <line x1="40" y1="40" x2="40" y2="400" stroke="#8b949e" stroke-width="2"/>
    <line x1="40" y1="400" x2="600" y2="400" stroke="#8b949e" stroke-width="2"/>
    <text x="20" y="220" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" transform="rotate(-90 20 220)" text-anchor="middle">log σ</text>
    <text x="320" y="430" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="middle">1/T</text>

    <!-- alumina: nearly flat -->
    <polyline points="60,360 200,355 380,350 540,348 590,346" fill="none" stroke="#f97583" stroke-width="3"/>
    <text x="540" y="335" font-family="JetBrains Mono, monospace" font-size="16" fill="#f97583">Al₂O₃</text>

    <!-- YSZ: steep, dashed for comparison -->
    <polyline points="60,80 200,160 380,260 540,340 590,360" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="60" y="70" font-family="JetBrains Mono, monospace" font-size="16" fill="#58a6ff">YSZ (for comparison)</text>
  </g>

  <text x="960" y="950" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">No runaway because there is no positive feedback to start.</text>
</svg>
