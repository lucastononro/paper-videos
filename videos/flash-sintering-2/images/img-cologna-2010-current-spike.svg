<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="76" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Cologna et al. 2010 — the current spike</text>
  <text x="960" y="118" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">YSZ at 850 °C, 120 V applied · log-current vs time, plus voltage and density</text>

  <!-- Single shared time axis at bottom -->
  <!-- Plot box -->
  <g transform="translate(170, 180)">
    <rect x="0" y="0" width="1580" height="780" fill="#10141b" stroke="#30363d" stroke-width="2"/>

    <!-- Grid -->
    <g stroke="#1f242d" stroke-width="1">
      <line x1="0" y1="195" x2="1580" y2="195"/>
      <line x1="0" y1="390" x2="1580" y2="390"/>
      <line x1="0" y1="585" x2="1580" y2="585"/>
      <line x1="316" y1="0" x2="316" y2="780"/>
      <line x1="632" y1="0" x2="632" y2="780"/>
      <line x1="948" y1="0" x2="948" y2="780"/>
      <line x1="1264" y1="0" x2="1264" y2="780"/>
    </g>

    <!-- LANE A (top) — Current (log scale) -->
    <text x="20" y="40" font-family="Inter, sans-serif" font-size="22" fill="#ff8c42" font-weight="700">Current (mA, log)</text>
    <!-- baseline (low current) -->
    <polyline points="0,170 700,170" fill="none" stroke="#ff8c42" stroke-width="3"/>
    <!-- the spike -->
    <path d="M 700 170 Q 760 168 800 100 Q 820 60 860 40 Q 880 32 920 30 Q 1000 28 1100 28 Q 1300 28 1580 30" fill="none" stroke="#ff8c42" stroke-width="3"/>
    <!-- spike marker -->
    <circle cx="800" cy="100" r="6" fill="#ff8c42"/>
    <text x="810" y="90" font-family="JetBrains Mono, monospace" font-size="18" fill="#ff8c42">×100</text>

    <!-- Lane separator -->
    <line x1="0" y1="195" x2="1580" y2="195" stroke="#30363d" stroke-width="1"/>

    <!-- LANE B (mid) — Voltage -->
    <text x="20" y="232" font-family="Inter, sans-serif" font-size="22" fill="#58a6ff" font-weight="700">Voltage (V)</text>
    <!-- voltage stays high until current limit hits (around t_spike), then drops -->
    <polyline points="0,260 700,260 800,260 820,300 870,360 1000,370 1300,372 1580,372" fill="none" stroke="#58a6ff" stroke-width="3"/>
    <text x="900" y="385" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e">supply flips: V control → I control</text>

    <!-- Lane separator -->
    <line x1="0" y1="390" x2="1580" y2="390" stroke="#30363d" stroke-width="1"/>

    <!-- LANE C — Density -->
    <text x="20" y="430" font-family="Inter, sans-serif" font-size="22" fill="#7ee787" font-weight="700">Relative density</text>
    <!-- starts ~0.6, jumps to ~0.99 over a few seconds after spike -->
    <polyline points="0,520 700,520 760,510 800,480 850,440 920,420 1000,415 1300,412 1580,412" fill="none" stroke="#7ee787" stroke-width="3"/>
    <text x="20" y="500" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e">~60%</text>
    <text x="1480" y="402" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="end">~99%</text>

    <!-- Lane separator -->
    <line x1="0" y1="585" x2="1580" y2="585" stroke="#30363d" stroke-width="1"/>

    <!-- LANE D — Power dissipation -->
    <text x="20" y="625" font-family="Inter, sans-serif" font-size="22" fill="#f97583" font-weight="700">Power dissipation (W)</text>
    <polyline points="0,720 700,720 770,640 800,610 820,620 870,640 920,650 1000,650 1300,650 1580,650" fill="none" stroke="#f97583" stroke-width="3"/>

    <!-- Time axis labels -->
    <text x="0" y="765" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e">0 s</text>
    <text x="700" y="765" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="middle">t_onset</text>
    <text x="1580" y="765" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="end">5 s</text>

    <!-- vertical "FLASH" marker -->
    <line x1="800" y1="0" x2="800" y2="780" stroke="#ffd866" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="810" y="770" font-family="JetBrains Mono, monospace" font-size="16" fill="#ffd866">FLASH</text>
  </g>

  <text x="960" y="1020" font-family="JetBrains Mono, monospace" font-size="16" fill="#8b949e" text-anchor="middle">Stylized re-creation after Cologna, Rashkova &amp; Raj, J. Am. Ceram. Soc. 93[11] (2010) — not the original figure.</text>
</svg>
