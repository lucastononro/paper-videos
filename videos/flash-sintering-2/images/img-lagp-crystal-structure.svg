<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#ffd866" text-anchor="middle" font-weight="700">LAGP — Li₁.₅Al₀.₅Ge₁.₅(PO₄)₃</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">NaSICON framework · 3D network of corner-sharing octahedra and tetrahedra</text>

  <!-- main structure panel -->
  <g transform="translate(700, 580)">
    <!-- background frame -->
    <rect x="-340" y="-340" width="680" height="680" rx="14" fill="#1a1d24" stroke="#30363d" stroke-width="3"/>

    <!-- Ge/Al octahedra (blue) at corners and centers of a 3x3 grid -->
    <g>
      <!-- octahedron at (-220,-220) -->
      <g transform="translate(-220, -220)">
        <polygon points="0,-40 35,-12 35,28 0,40 -35,28 -35,-12" fill="#58a6ff" stroke="#3b82c9" stroke-width="2" opacity="0.85"/>
        <line x1="0" y1="-40" x2="0" y2="40" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="-12" x2="35" y2="-12" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="28" x2="35" y2="28" stroke="#3b82c9" stroke-width="1.5"/>
      </g>
      <g transform="translate(0, -220)">
        <polygon points="0,-40 35,-12 35,28 0,40 -35,28 -35,-12" fill="#58a6ff" stroke="#3b82c9" stroke-width="2" opacity="0.85"/>
        <line x1="0" y1="-40" x2="0" y2="40" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="-12" x2="35" y2="-12" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="28" x2="35" y2="28" stroke="#3b82c9" stroke-width="1.5"/>
      </g>
      <g transform="translate(220, -220)">
        <polygon points="0,-40 35,-12 35,28 0,40 -35,28 -35,-12" fill="#58a6ff" stroke="#3b82c9" stroke-width="2" opacity="0.85"/>
        <line x1="0" y1="-40" x2="0" y2="40" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="-12" x2="35" y2="-12" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="28" x2="35" y2="28" stroke="#3b82c9" stroke-width="1.5"/>
      </g>
      <g transform="translate(-220, 0)">
        <polygon points="0,-40 35,-12 35,28 0,40 -35,28 -35,-12" fill="#58a6ff" stroke="#3b82c9" stroke-width="2" opacity="0.85"/>
        <line x1="0" y1="-40" x2="0" y2="40" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="-12" x2="35" y2="-12" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="28" x2="35" y2="28" stroke="#3b82c9" stroke-width="1.5"/>
      </g>
      <g transform="translate(220, 0)">
        <polygon points="0,-40 35,-12 35,28 0,40 -35,28 -35,-12" fill="#58a6ff" stroke="#3b82c9" stroke-width="2" opacity="0.85"/>
        <line x1="0" y1="-40" x2="0" y2="40" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="-12" x2="35" y2="-12" stroke="#3b82c9" stroke-width="1.5"/>
        <line x1="-35" y1="28" x2="35" y2="28" stroke="#3b82c9" stroke-width="1.5"/>
      </g>
      <g transform="translate(-220, 220)">
        <polygon points="0,-40 35,-12 35,28 0,40 -35,28 -35,-12" fill="#58a6ff" stroke="#3b82c9" stroke-width="2" opacity="0.85"/>
      </g>
      <g transform="translate(0, 220)">
        <polygon points="0,-40 35,-12 35,28 0,40 -35,28 -35,-12" fill="#58a6ff" stroke="#3b82c9" stroke-width="2" opacity="0.85"/>
      </g>
      <g transform="translate(220, 220)">
        <polygon points="0,-40 35,-12 35,28 0,40 -35,28 -35,-12" fill="#58a6ff" stroke="#3b82c9" stroke-width="2" opacity="0.85"/>
      </g>
    </g>

    <!-- PO4 tetrahedra (orange) at midpoints between octahedra -->
    <g>
      <g transform="translate(-110, -220)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(110, -220)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(-220, -110)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(0, -110)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(220, -110)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(-110, 0)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(110, 0)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(-220, 110)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(0, 110)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(220, 110)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(-110, 220)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
      <g transform="translate(110, 220)">
        <polygon points="0,-26 22,12 -22,12" fill="#ff8c42" stroke="#c25a1a" stroke-width="2" opacity="0.9"/>
      </g>
    </g>

    <!-- Li+ ion channels (yellow path arrows) -->
    <g stroke="#ffd866" stroke-width="4" fill="none" opacity="0.85">
      <path d="M -300 -110 Q -110 -110 110 -110 Q 280 -110 300 -110" marker-end="url(#liarrow)"/>
      <path d="M -110 -300 Q -110 -110 -110 110 Q -110 280 -110 300" marker-end="url(#liarrow)"/>
      <path d="M 110 -300 Q 110 -110 110 110 Q 110 280 110 300" marker-end="url(#liarrow)"/>
    </g>
    <!-- Li+ ions on channels -->
    <g fill="#ffd866">
      <circle cx="-160" cy="-110" r="10" stroke="#c4a534" stroke-width="2"/>
      <circle cx="60" cy="-110" r="10" stroke="#c4a534" stroke-width="2"/>
      <circle cx="240" cy="-110" r="10" stroke="#c4a534" stroke-width="2"/>
      <circle cx="-110" cy="60" r="10" stroke="#c4a534" stroke-width="2"/>
      <circle cx="-110" cy="240" r="10" stroke="#c4a534" stroke-width="2"/>
      <circle cx="110" cy="60" r="10" stroke="#c4a534" stroke-width="2"/>
      <circle cx="110" cy="240" r="10" stroke="#c4a534" stroke-width="2"/>
    </g>
    <text x="0" y="-110" font-family="JetBrains Mono, monospace" font-size="12" fill="#0e1117" text-anchor="middle" font-weight="700">Li⁺</text>

    <defs>
      <marker id="liarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0 0, 10 5, 0 10" fill="#ffd866"/>
      </marker>
    </defs>
  </g>

  <!-- Legend on right -->
  <g transform="translate(1280, 460)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="26" fill="#e6edf3" font-weight="700">Components</text>
    <polygon points="20,30 50,46 50,70 20,86 -10,70 -10,46" fill="#58a6ff" stroke="#3b82c9" stroke-width="2"/>
    <text x="80" y="62" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">(Ge/Al)O₆ octahedra</text>
    <polygon points="20,118 42,148 -2,148" fill="#ff8c42" stroke="#c25a1a" stroke-width="2"/>
    <text x="80" y="148" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">PO₄ tetrahedra</text>
    <circle cx="20" cy="200" r="12" fill="#ffd866" stroke="#c4a534" stroke-width="2"/>
    <text x="80" y="208" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Li⁺ ions in channels</text>
    <line x1="-10" y1="248" x2="50" y2="248" stroke="#ffd866" stroke-width="4"/>
    <text x="80" y="256" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">3D conduction pathways</text>

    <line x1="-10" y1="310" x2="320" y2="310" stroke="#30363d" stroke-width="2"/>
    <text x="0" y="350" font-family="JetBrains Mono, monospace" font-size="18" fill="#8b949e">σ_Li ≈ 10⁻⁴ S/cm at 25 °C</text>
    <text x="0" y="380" font-family="JetBrains Mono, monospace" font-size="18" fill="#8b949e">space group: R-3c</text>
    <text x="0" y="410" font-family="JetBrains Mono, monospace" font-size="18" fill="#8b949e">solid-state Li-battery electrolyte</text>
  </g>

  <text x="960" y="1020" font-family="JetBrains Mono, monospace" font-size="18" fill="#8b949e" text-anchor="middle">Stylized NaSICON framework — Li⁺ hops along channels formed by the octahedra–tetrahedra network</text>
</svg>
