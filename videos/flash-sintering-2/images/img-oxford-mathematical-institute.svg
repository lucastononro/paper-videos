<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <defs>
    <linearGradient id="oxsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243355"/>
      <stop offset="100%" stop-color="#3a4a78"/>
    </linearGradient>
  </defs>
  <rect x="0" y="160" width="1920" height="600" fill="url(#oxsky)"/>

  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Oxford Mathematical Institute (Andrew Wiles Building)</text>

  <!-- Building: modern glass + stone -->
  <g>
    <!-- ground -->
    <rect x="0" y="780" width="1920" height="300" fill="#1a2030"/>
    <!-- main rectangular block -->
    <rect x="200" y="380" width="1520" height="400" fill="#7a8090" stroke="#4a4f5a" stroke-width="3"/>
    <!-- a tessellated facade pattern (Penrose-tile-inspired diamond grid) -->
    <g stroke="#4a4f5a" stroke-width="2" fill="#3a4055">
      <!-- row 1 -->
      <polygon points="220,400 280,420 220,440" />
      <polygon points="280,400 340,420 340,440 280,460" fill="#5a6072"/>
      <polygon points="340,400 400,420 400,440 340,440" fill="#3a4055"/>
      <polygon points="400,400 460,420 400,460" fill="#5a6072"/>
      <polygon points="460,400 520,420 520,440 460,460" fill="#3a4055"/>
      <polygon points="520,400 580,420 580,440 520,440" fill="#5a6072"/>
      <polygon points="580,400 640,420 580,460" fill="#3a4055"/>
      <polygon points="640,400 700,420 700,440 640,460" fill="#5a6072"/>
      <polygon points="700,400 760,420 700,460" fill="#3a4055"/>
      <polygon points="760,400 820,420 820,440 760,460" fill="#5a6072"/>
      <polygon points="820,400 880,420 820,460" fill="#3a4055"/>
      <polygon points="880,400 940,420 940,440 880,460" fill="#5a6072"/>
      <polygon points="940,400 1000,420 940,460" fill="#3a4055"/>
      <polygon points="1000,400 1060,420 1060,440 1000,460" fill="#5a6072"/>
      <polygon points="1060,400 1120,420 1060,460" fill="#3a4055"/>
      <polygon points="1120,400 1180,420 1180,440 1120,460" fill="#5a6072"/>
      <polygon points="1180,400 1240,420 1180,460" fill="#3a4055"/>
      <polygon points="1240,400 1300,420 1300,440 1240,460" fill="#5a6072"/>
      <polygon points="1300,400 1360,420 1300,460" fill="#3a4055"/>
      <polygon points="1360,400 1420,420 1420,440 1360,460" fill="#5a6072"/>
      <polygon points="1420,400 1480,420 1420,460" fill="#3a4055"/>
      <polygon points="1480,400 1540,420 1540,440 1480,460" fill="#5a6072"/>
      <polygon points="1540,400 1600,420 1540,460" fill="#3a4055"/>
      <polygon points="1600,400 1660,420 1660,440 1600,460" fill="#5a6072"/>
      <polygon points="1660,400 1720,420 1660,460" fill="#3a4055"/>
    </g>
    <!-- glass strip (windows) -->
    <rect x="200" y="500" width="1520" height="180" fill="#0e1117" opacity="0.7"/>
    <g fill="#3a5478" opacity="0.6">
      <rect x="220" y="520" width="80" height="140"/><rect x="320" y="520" width="80" height="140"/><rect x="420" y="520" width="80" height="140"/><rect x="520" y="520" width="80" height="140"/><rect x="620" y="520" width="80" height="140"/><rect x="720" y="520" width="80" height="140"/><rect x="820" y="520" width="80" height="140"/><rect x="920" y="520" width="80" height="140"/><rect x="1020" y="520" width="80" height="140"/><rect x="1120" y="520" width="80" height="140"/><rect x="1220" y="520" width="80" height="140"/><rect x="1320" y="520" width="80" height="140"/><rect x="1420" y="520" width="80" height="140"/><rect x="1520" y="520" width="80" height="140"/><rect x="1620" y="520" width="80" height="140"/>
    </g>
    <!-- entrance lobby -->
    <rect x="860" y="640" width="200" height="140" fill="#1a2030" stroke="#58a6ff" stroke-width="2"/>
  </g>

  <text x="960" y="900" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Where Ian Hewitt and Andrew Lacey did the Hewitt–Lacey–Todd analysis (2015)</text>
  <text x="960" y="940" font-family="JetBrains Mono, monospace" font-size="16" fill="#8b949e" text-anchor="middle">Stylized illustration</text>
</svg>
