<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Microchip on a white ceramic substrate</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Al₂O₃ or AlN — sintered, then patterned and soldered</text>

  <!-- substrate base (white) -->
  <g transform="translate(960, 600)">
    <!-- shadow -->
    <ellipse cx="0" cy="280" rx="540" ry="40" fill="#000" opacity="0.5"/>
    <!-- substrate top -->
    <path d="M -560 -160 L 560 -160 L 540 200 L -540 200 Z" fill="#e6e6dc" stroke="#bbbbac" stroke-width="3"/>
    <!-- highlight -->
    <path d="M -540 -150 L -440 -150 L -460 190 L -540 190 Z" fill="#fff" opacity="0.18"/>

    <!-- traces (gold) -->
    <g stroke="#ffd866" stroke-width="6" fill="none">
      <line x1="-400" y1="-80" x2="-100" y2="-80"/>
      <line x1="-400" y1="-40" x2="-100" y2="-40"/>
      <line x1="-400" y1="0" x2="-100" y2="0"/>
      <line x1="-400" y1="40" x2="-100" y2="40"/>
      <line x1="-400" y1="80" x2="-100" y2="80"/>

      <line x1="180" y1="-80" x2="480" y2="-80"/>
      <line x1="180" y1="-40" x2="480" y2="-40"/>
      <line x1="180" y1="0" x2="480" y2="0"/>
      <line x1="180" y1="40" x2="480" y2="40"/>
      <line x1="180" y1="80" x2="480" y2="80"/>

      <line x1="-50" y1="120" x2="-50" y2="180"/>
      <line x1="0" y1="120" x2="0" y2="180"/>
      <line x1="50" y1="120" x2="50" y2="180"/>
    </g>

    <!-- chip in the middle -->
    <rect x="-160" y="-110" width="320" height="220" rx="6" fill="#1a1a1f" stroke="#444" stroke-width="2"/>
    <!-- chip markings -->
    <text x="0" y="-30" font-family="JetBrains Mono, monospace" font-size="24" fill="#c9d1d9" text-anchor="middle">SoC-A1</text>
    <text x="0" y="10" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="middle">PROC · 8C</text>
    <text x="0" y="40" font-family="JetBrains Mono, monospace" font-size="10" fill="#8b949e" text-anchor="middle">©2026</text>
    <!-- chip corner pin -->
    <circle cx="-130" cy="-80" r="4" fill="#ffd866"/>
  </g>

  <text x="200" y="900" font-family="Inter, sans-serif" font-size="22" fill="#58a6ff">ceramic substrate</text>
  <text x="200" y="930" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">99% dense alumina, sintered at 1600 °C, ground flat to ±1 µm</text>
</svg>
