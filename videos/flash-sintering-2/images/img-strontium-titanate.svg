<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#7ee787" text-anchor="middle" font-weight="700">SrTiO₃ — strontium titanate</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">perovskite. Flashes near 650 °C.</text>

  <!-- perovskite unit cell -->
  <g transform="translate(960, 600)" stroke="#8b949e" stroke-width="2">
    <!-- back face (lighter) -->
    <line x1="-160" y1="-100" x2="160" y2="-100"/>
    <line x1="160" y1="-100" x2="160" y2="220"/>
    <line x1="160" y1="220" x2="-160" y2="220"/>
    <line x1="-160" y1="220" x2="-160" y2="-100"/>
    <!-- front face -->
    <line x1="-220" y1="-40" x2="100" y2="-40"/>
    <line x1="100" y1="-40" x2="100" y2="280"/>
    <line x1="100" y1="280" x2="-220" y2="280"/>
    <line x1="-220" y1="280" x2="-220" y2="-40"/>
    <!-- connecting edges -->
    <line x1="-160" y1="-100" x2="-220" y2="-40"/>
    <line x1="160" y1="-100" x2="100" y2="-40"/>
    <line x1="160" y1="220" x2="100" y2="280"/>
    <line x1="-160" y1="220" x2="-220" y2="280"/>

    <!-- corners: Sr (large purple/red) -->
    <g fill="#a04a78">
      <circle cx="-160" cy="-100" r="22"/>
      <circle cx="160" cy="-100" r="22"/>
      <circle cx="160" cy="220" r="22"/>
      <circle cx="-160" cy="220" r="22"/>
      <circle cx="-220" cy="-40" r="22"/>
      <circle cx="100" cy="-40" r="22"/>
      <circle cx="100" cy="280" r="22"/>
      <circle cx="-220" cy="280" r="22"/>
    </g>
    <!-- center: Ti -->
    <circle cx="-30" cy="60" r="18" fill="#58a6ff"/>
    <!-- face-centered O -->
    <g fill="#f97583">
      <circle cx="0" cy="-100" r="14"/>
      <circle cx="-30" cy="-40" r="14"/>
      <circle cx="-30" cy="220" r="14"/>
      <circle cx="-90" cy="60" r="14"/>
      <circle cx="100" cy="60" r="14"/>
      <circle cx="-30" cy="120" r="14"/>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(1480, 460)">
    <circle cx="0" cy="0" r="14" fill="#a04a78"/><text x="22" y="6" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Sr²⁺</text>
    <circle cx="0" cy="40" r="14" fill="#58a6ff"/><text x="22" y="46" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">Ti⁴⁺</text>
    <circle cx="0" cy="80" r="14" fill="#f97583"/><text x="22" y="86" font-family="Inter, sans-serif" font-size="20" fill="#c9d1d9">O²⁻</text>
  </g>

  <text x="960" y="990" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">Used in resistive switches, capacitors, oxygen sensors. Doping easily tunes σ(T).</text>
</svg>
