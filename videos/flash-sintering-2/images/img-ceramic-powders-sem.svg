<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Ceramic powder — SEM-style view</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">irregular sub-micron grains, the starting point of every ceramic</text>

  <!-- Frame as if SEM image -->
  <rect x="240" y="180" width="1440" height="780" fill="#1a1d24" stroke="#30363d" stroke-width="3"/>

  <!-- random scattering of grain shapes -->
  <g>
    <!-- big grains -->
    <ellipse cx="420" cy="320" rx="48" ry="42" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(20 420 320)"/>
    <ellipse cx="580" cy="280" rx="42" ry="36" fill="#666c78" stroke="#8b949e" stroke-width="2" transform="rotate(-15 580 280)"/>
    <ellipse cx="740" cy="350" rx="55" ry="44" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(35 740 350)"/>
    <ellipse cx="940" cy="290" rx="60" ry="50" fill="#6a707c" stroke="#8b949e" stroke-width="2" transform="rotate(-30 940 290)"/>
    <ellipse cx="1140" cy="320" rx="45" ry="38" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(10 1140 320)"/>
    <ellipse cx="1320" cy="270" rx="52" ry="42" fill="#666c78" stroke="#8b949e" stroke-width="2" transform="rotate(-25 1320 270)"/>
    <ellipse cx="1500" cy="340" rx="48" ry="40" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(40 1500 340)"/>
    <ellipse cx="380" cy="500" rx="56" ry="45" fill="#6a707c" stroke="#8b949e" stroke-width="2" transform="rotate(-20 380 500)"/>
    <ellipse cx="540" cy="490" rx="42" ry="38" fill="#5d6470" stroke="#8b949e" stroke-width="2"/>
    <ellipse cx="700" cy="540" rx="50" ry="42" fill="#666c78" stroke="#8b949e" stroke-width="2" transform="rotate(25 700 540)"/>
    <ellipse cx="880" cy="500" rx="44" ry="40" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(-40 880 500)"/>
    <ellipse cx="1080" cy="540" rx="58" ry="48" fill="#6a707c" stroke="#8b949e" stroke-width="2" transform="rotate(15 1080 540)"/>
    <ellipse cx="1280" cy="490" rx="46" ry="38" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(-15 1280 490)"/>
    <ellipse cx="1460" cy="520" rx="52" ry="42" fill="#666c78" stroke="#8b949e" stroke-width="2" transform="rotate(30 1460 520)"/>
    <ellipse cx="400" cy="700" rx="44" ry="40" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(45 400 700)"/>
    <ellipse cx="580" cy="720" rx="56" ry="48" fill="#6a707c" stroke="#8b949e" stroke-width="2" transform="rotate(-20 580 720)"/>
    <ellipse cx="760" cy="690" rx="48" ry="40" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(10 760 690)"/>
    <ellipse cx="960" cy="730" rx="54" ry="44" fill="#666c78" stroke="#8b949e" stroke-width="2" transform="rotate(-35 960 730)"/>
    <ellipse cx="1160" cy="700" rx="46" ry="40" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(20 1160 700)"/>
    <ellipse cx="1340" cy="730" rx="52" ry="42" fill="#6a707c" stroke="#8b949e" stroke-width="2"/>
    <ellipse cx="1520" cy="700" rx="46" ry="38" fill="#5d6470" stroke="#8b949e" stroke-width="2" transform="rotate(15 1520 700)"/>

    <!-- many small grains -->
    <g fill="#444a55" stroke="#666c78" stroke-width="1">
      <circle cx="320" cy="380" r="14"/><circle cx="490" cy="370" r="16"/><circle cx="650" cy="420" r="13"/><circle cx="820" cy="380" r="15"/>
      <circle cx="1010" cy="380" r="13"/><circle cx="1200" cy="380" r="15"/><circle cx="1390" cy="370" r="14"/><circle cx="1580" cy="420" r="13"/>
      <circle cx="280" cy="580" r="14"/><circle cx="460" cy="580" r="16"/><circle cx="630" cy="620" r="13"/><circle cx="800" cy="600" r="15"/>
      <circle cx="980" cy="610" r="14"/><circle cx="1170" cy="590" r="15"/><circle cx="1360" cy="600" r="13"/><circle cx="1560" cy="610" r="14"/>
      <circle cx="320" cy="820" r="15"/><circle cx="500" cy="820" r="14"/><circle cx="680" cy="800" r="13"/><circle cx="860" cy="820" r="16"/>
      <circle cx="1050" cy="810" r="13"/><circle cx="1240" cy="820" r="15"/><circle cx="1430" cy="800" r="14"/><circle cx="1610" cy="820" r="13"/>
    </g>

    <!-- pores (darker patches) -->
    <ellipse cx="510" cy="430" rx="8" ry="6" fill="#0e1117"/>
    <ellipse cx="870" cy="430" rx="10" ry="7" fill="#0e1117"/>
    <ellipse cx="1250" cy="430" rx="8" ry="6" fill="#0e1117"/>
    <ellipse cx="450" cy="650" rx="10" ry="7" fill="#0e1117"/>
    <ellipse cx="820" cy="650" rx="9" ry="6" fill="#0e1117"/>
    <ellipse cx="1200" cy="650" rx="11" ry="7" fill="#0e1117"/>
  </g>

  <!-- SEM scalebar -->
  <g>
    <rect x="1480" y="900" width="160" height="30" fill="#161b22" stroke="#e6edf3" stroke-width="1"/>
    <line x1="1500" y1="915" x2="1620" y2="915" stroke="#e6edf3" stroke-width="3"/>
    <text x="1560" y="950" font-family="JetBrains Mono, monospace" font-size="18" fill="#e6edf3" text-anchor="middle">1 µm</text>
  </g>

  <text x="270" y="940" font-family="JetBrains Mono, monospace" font-size="18" fill="#8b949e">SEM · YSZ powder · stylized illustration</text>
</svg>
