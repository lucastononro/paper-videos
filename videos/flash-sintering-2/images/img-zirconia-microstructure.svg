<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#ffd866" text-anchor="middle" font-weight="700">YSZ — yttria-stabilized zirconia</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">the original. Flashes at ~850 °C.</text>

  <!-- left: sample disc -->
  <g transform="translate(540, 580)">
    <ellipse cx="0" cy="170" rx="200" ry="22" fill="#000" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="200" ry="200" fill="#a8a8a4" stroke="#5a5a5a" stroke-width="3"/>
    <ellipse cx="-50" cy="-50" rx="60" ry="30" fill="#fff" opacity="0.18"/>
    <text x="0" y="-220" font-family="JetBrains Mono, monospace" font-size="22" fill="#ffd866" text-anchor="middle">3 mol% Y₂O₃ in ZrO₂</text>
  </g>

  <!-- right: micrograph hex tiles -->
  <g transform="translate(1280, 580)">
    <rect x="-220" y="-220" width="440" height="440" fill="#1a1d24" stroke="#30363d" stroke-width="3"/>
    <g stroke="#666" stroke-width="2" fill="#5a606c">
      <polygon points="-200,-200 -120,-200 -90,-150 -120,-100 -200,-100 -230,-150" fill="#5a606c"/>
      <polygon points="-120,-200 -40,-200 -10,-150 -40,-100 -120,-100 -90,-150" fill="#666c78"/>
      <polygon points="-40,-200 40,-200 70,-150 40,-100 -40,-100 -10,-150" fill="#5a606c"/>
      <polygon points="40,-200 120,-200 150,-150 120,-100 40,-100 70,-150" fill="#666c78"/>
      <polygon points="120,-200 200,-200 200,-100 120,-100 150,-150" fill="#5a606c"/>

      <polygon points="-200,-100 -120,-100 -90,-50 -120,0 -200,0 -230,-50" fill="#666c78"/>
      <polygon points="-120,-100 -40,-100 -10,-50 -40,0 -120,0 -90,-50" fill="#5a606c"/>
      <polygon points="-40,-100 40,-100 70,-50 40,0 -40,0 -10,-50" fill="#666c78"/>
      <polygon points="40,-100 120,-100 150,-50 120,0 40,0 70,-50" fill="#5a606c"/>
      <polygon points="120,-100 200,-100 200,0 120,0 150,-50" fill="#666c78"/>

      <polygon points="-200,0 -120,0 -90,50 -120,100 -200,100 -230,50" fill="#5a606c"/>
      <polygon points="-120,0 -40,0 -10,50 -40,100 -120,100 -90,50" fill="#666c78"/>
      <polygon points="-40,0 40,0 70,50 40,100 -40,100 -10,50" fill="#5a606c"/>
      <polygon points="40,0 120,0 150,50 120,100 40,100 70,50" fill="#666c78"/>
      <polygon points="120,0 200,0 200,100 120,100 150,50" fill="#5a606c"/>

      <polygon points="-200,100 -120,100 -90,150 -120,200 -200,200 -230,150" fill="#666c78"/>
      <polygon points="-120,100 -40,100 -10,150 -40,200 -120,200 -90,150" fill="#5a606c"/>
      <polygon points="-40,100 40,100 70,150 40,200 -40,200 -10,150" fill="#666c78"/>
      <polygon points="40,100 120,100 150,150 120,200 40,200 70,150" fill="#5a606c"/>
      <polygon points="120,100 200,100 200,200 120,200 150,150" fill="#666c78"/>
    </g>
    <g>
      <line x1="120" y1="200" x2="200" y2="200" stroke="#fff" stroke-width="3"/>
      <text x="160" y="222" font-family="JetBrains Mono, monospace" font-size="14" fill="#fff" text-anchor="middle">2 µm</text>
    </g>
  </g>

  <text x="960" y="950" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">Cologna 2010: V/L ≈ 12 V/mm · T_furnace 850 °C · 99% density in &lt; 5 s</text>
</svg>
