<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Pilot-scale flash-sintering line</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Lucideon (UK), NIMS (Japan) — pre-commercial demonstrators</text>

  <!-- conveyor running through a small flash chamber -->
  <g transform="translate(0, 540)">
    <!-- floor -->
    <rect x="0" y="280" width="1920" height="200" fill="#161b22"/>
    <line x1="0" y1="280" x2="1920" y2="280" stroke="#30363d" stroke-width="2"/>

    <!-- conveyor belt -->
    <rect x="160" y="200" width="1600" height="60" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="2"/>
    <g stroke="#4a4a4a" stroke-width="2">
      <line x1="240" y1="200" x2="240" y2="260"/>
      <line x1="320" y1="200" x2="320" y2="260"/>
      <line x1="400" y1="200" x2="400" y2="260"/>
      <line x1="480" y1="200" x2="480" y2="260"/>
      <line x1="560" y1="200" x2="560" y2="260"/>
      <line x1="640" y1="200" x2="640" y2="260"/>
      <line x1="720" y1="200" x2="720" y2="260"/>
      <line x1="800" y1="200" x2="800" y2="260"/>
      <line x1="880" y1="200" x2="880" y2="260"/>
      <line x1="960" y1="200" x2="960" y2="260"/>
      <line x1="1040" y1="200" x2="1040" y2="260"/>
      <line x1="1120" y1="200" x2="1120" y2="260"/>
      <line x1="1200" y1="200" x2="1200" y2="260"/>
      <line x1="1280" y1="200" x2="1280" y2="260"/>
      <line x1="1360" y1="200" x2="1360" y2="260"/>
      <line x1="1440" y1="200" x2="1440" y2="260"/>
      <line x1="1520" y1="200" x2="1520" y2="260"/>
      <line x1="1600" y1="200" x2="1600" y2="260"/>
      <line x1="1680" y1="200" x2="1680" y2="260"/>
    </g>
    <!-- belt rollers -->
    <circle cx="200" cy="230" r="40" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="2"/>
    <circle cx="1720" cy="230" r="40" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="2"/>

    <!-- flash chamber: orange glow box around middle -->
    <rect x="780" y="100" width="360" height="180" fill="#1a1d24" stroke="#ff8c42" stroke-width="3"/>
    <text x="960" y="92" font-family="Inter, sans-serif" font-size="20" fill="#ff8c42" text-anchor="middle">flash chamber</text>
    <!-- glow inside -->
    <ellipse cx="960" cy="190" rx="120" ry="50" fill="#ff8c42" opacity="0.45"/>
    <ellipse cx="960" cy="190" rx="80" ry="34" fill="#ffd866" opacity="0.7"/>
    <!-- electrodes hanging down inside -->
    <line x1="960" y1="100" x2="960" y2="160" stroke="#c9d1d9" stroke-width="4"/>
    <line x1="960" y1="220" x2="960" y2="260" stroke="#c9d1d9" stroke-width="4"/>

    <!-- discs on belt (multiple) -->
    <g>
      <ellipse cx="320" cy="200" rx="22" ry="6" fill="#888"/>
      <ellipse cx="450" cy="200" rx="22" ry="6" fill="#888"/>
      <ellipse cx="580" cy="200" rx="22" ry="6" fill="#888"/>
      <ellipse cx="720" cy="200" rx="22" ry="6" fill="#888"/>
      <ellipse cx="960" cy="200" rx="22" ry="6" fill="#ffd866"/>
      <ellipse cx="1240" cy="200" rx="22" ry="6" fill="#9a9a9a"/>
      <ellipse cx="1380" cy="200" rx="22" ry="6" fill="#9a9a9a"/>
      <ellipse cx="1520" cy="200" rx="22" ry="6" fill="#9a9a9a"/>
      <ellipse cx="1650" cy="200" rx="22" ry="6" fill="#9a9a9a"/>
    </g>

    <!-- direction arrow -->
    <g transform="translate(960, 360)">
      <line x1="-220" y1="0" x2="220" y2="0" stroke="#58a6ff" stroke-width="3"/>
      <polygon points="216,-8 240,0 216,8" fill="#58a6ff"/>
      <text x="0" y="30" font-family="JetBrains Mono, monospace" font-size="16" fill="#58a6ff" text-anchor="middle">~5 s/disc</text>
    </g>
  </g>

  <text x="960" y="990" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">Patents. Spin-outs. A slow commercial story.</text>
</svg>
