<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Edgar D. Zanotto</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">UFSCar · CeRTEV — leading glass-ceramics scientist</text>

  <!-- Portrait frame -->
  <g transform="translate(960, 600)">
    <rect x="-220" y="-280" width="440" height="540" rx="14" fill="#161b22" stroke="#ffd866" stroke-width="3"/>
    <!-- silhouette -->
    <circle cx="0" cy="-110" r="92" fill="#2a3140" stroke="#ffd866" stroke-width="2"/>
    <!-- shoulders -->
    <path d="M -180 240 Q -180 30 -110 -10 Q -60 30 0 30 Q 60 30 110 -10 Q 180 30 180 240 Z" fill="#2a3140" stroke="#ffd866" stroke-width="2"/>
  </g>

  <!-- Bio block on right -->
  <g transform="translate(1280, 400)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="28" fill="#ffd866" font-weight="700">Edgar D. Zanotto</text>
    <text x="0" y="40" font-family="Inter, sans-serif" font-size="22" fill="#c9d1d9">Professor, Materials Engineering</text>
    <text x="0" y="70" font-family="Inter, sans-serif" font-size="22" fill="#c9d1d9">UFSCar — São Carlos, Brazil</text>
    <line x1="0" y1="100" x2="340" y2="100" stroke="#30363d" stroke-width="2"/>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="20" fill="#8b949e">Director, CeRTEV (vitreous materials)</text>
    <text x="0" y="170" font-family="Inter, sans-serif" font-size="20" fill="#8b949e">glass crystallization kinetics</text>
    <text x="0" y="200" font-family="Inter, sans-serif" font-size="20" fill="#8b949e">700+ papers · h-index &gt; 70</text>
    <text x="0" y="230" font-family="Inter, sans-serif" font-size="20" fill="#8b949e">Brazilian Academy of Sciences</text>
  </g>

  <!-- Left bio bullets -->
  <g transform="translate(360, 460)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="22" fill="#58a6ff" font-weight="700">Field</text>
    <text x="0" y="36" font-family="Inter, sans-serif" font-size="18" fill="#c9d1d9">glass-ceramics</text>
    <text x="0" y="64" font-family="Inter, sans-serif" font-size="18" fill="#c9d1d9">nucleation &amp; growth</text>
    <text x="0" y="92" font-family="Inter, sans-serif" font-size="18" fill="#c9d1d9">bioceramics</text>
    <text x="0" y="120" font-family="Inter, sans-serif" font-size="18" fill="#c9d1d9">flash crystallization</text>
  </g>

  <text x="960" y="990" font-family="JetBrains Mono, monospace" font-size="18" fill="#8b949e" text-anchor="middle">Stylized portrait — see lamav.ufscar.br for the official photo</text>
</svg>
