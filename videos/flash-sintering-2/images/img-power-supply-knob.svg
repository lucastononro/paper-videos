<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">DC supply — voltage knob</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">"on this run, they pushed it higher than usual"</text>

  <!-- supply faceplate -->
  <g transform="translate(960, 600)">
    <rect x="-440" y="-260" width="880" height="520" rx="14" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <text x="-420" y="-220" font-family="JetBrains Mono, monospace" font-size="20" fill="#8b949e">SORENSEN DLM 600·5</text>

    <!-- two displays -->
    <rect x="-380" y="-180" width="320" height="80" fill="#0e1117" stroke="#30363d" stroke-width="2"/>
    <text x="-220" y="-122" font-family="JetBrains Mono, monospace" font-size="48" fill="#ff8c42" text-anchor="middle" font-weight="700">120.0 V</text>
    <text x="-380" y="-90" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e">VOLTS</text>

    <rect x="60" y="-180" width="320" height="80" fill="#0e1117" stroke="#30363d" stroke-width="2"/>
    <text x="220" y="-122" font-family="JetBrains Mono, monospace" font-size="48" fill="#ffd866" text-anchor="middle" font-weight="700">0.85 A</text>
    <text x="60" y="-90" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e">AMPS</text>

    <!-- big knob -->
    <circle cx="0" cy="80" r="160" fill="#0e1117" stroke="#8b949e" stroke-width="4"/>
    <circle cx="0" cy="80" r="130" fill="#1a1d24" stroke="#8b949e" stroke-width="2"/>
    <!-- knob indicator -->
    <line x1="0" y1="80" x2="60" y2="-20" stroke="#ff8c42" stroke-width="6"/>
    <circle cx="0" cy="80" r="14" fill="#ff8c42"/>
    <!-- ticks -->
    <g stroke="#c9d1d9" stroke-width="2">
      <line x1="0" y1="-90" x2="0" y2="-72"/>
      <line x1="60" y1="-72" x2="48" y2="-58"/>
      <line x1="120" y1="-30" x2="100" y2="-20"/>
      <line x1="146" y1="40" x2="124" y2="46"/>
      <line x1="146" y1="120" x2="124" y2="114"/>
      <line x1="120" y1="190" x2="100" y2="180"/>
      <line x1="60" y1="232" x2="48" y2="218"/>
      <line x1="0" y1="250" x2="0" y2="232"/>
      <line x1="-60" y1="232" x2="-48" y2="218"/>
      <line x1="-120" y1="190" x2="-100" y2="180"/>
      <line x1="-146" y1="120" x2="-124" y2="114"/>
      <line x1="-146" y1="40" x2="-124" y2="46"/>
      <line x1="-120" y1="-30" x2="-100" y2="-20"/>
      <line x1="-60" y1="-72" x2="-48" y2="-58"/>
    </g>
    <!-- value labels around knob -->
    <text x="-160" y="20" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="end">0</text>
    <text x="160" y="20" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e">600 V</text>
    <text x="0" y="-110" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="middle">300</text>

    <text x="0" y="280" font-family="Inter, sans-serif" font-size="20" fill="#e6edf3" text-anchor="middle">VOLTAGE COARSE</text>
  </g>

  <text x="960" y="990" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">A turn beyond the usual setting. Then the ammeter went off the chart.</text>
</svg>
