<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <!-- sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="100%" stop-color="#324a70"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#sky)"/>

  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">University of Colorado Boulder — engineering complex</text>

  <!-- mountains in distance -->
  <g fill="#1a2638" stroke="#0e1117" stroke-width="2">
    <polygon points="0,560 200,400 380,500 560,360 740,490 920,380 1100,520 1280,400 1480,510 1660,420 1920,560"/>
  </g>

  <!-- ground -->
  <rect x="0" y="600" width="1920" height="480" fill="#1a2030"/>

  <!-- buildings: Boulder's reddish sandstone -->
  <g>
    <!-- Building A: tall, multi-story sandstone -->
    <rect x="220" y="380" width="380" height="380" fill="#a05a3a" stroke="#5a3020" stroke-width="3"/>
    <!-- red-tile roof -->
    <polygon points="220,380 600,380 580,330 240,330" fill="#7a2818"/>
    <!-- windows grid -->
    <g fill="#1a2230" stroke="#2a3040" stroke-width="1">
      <rect x="260" y="420" width="34" height="50"/>
      <rect x="320" y="420" width="34" height="50"/>
      <rect x="380" y="420" width="34" height="50"/>
      <rect x="440" y="420" width="34" height="50"/>
      <rect x="500" y="420" width="34" height="50"/>
      <rect x="560" y="420" width="34" height="50"/>
      <rect x="260" y="500" width="34" height="50"/>
      <rect x="320" y="500" width="34" height="50"/>
      <rect x="380" y="500" width="34" height="50"/>
      <rect x="440" y="500" width="34" height="50"/>
      <rect x="500" y="500" width="34" height="50"/>
      <rect x="560" y="500" width="34" height="50"/>
      <rect x="260" y="580" width="34" height="50"/>
      <rect x="320" y="580" width="34" height="50"/>
      <rect x="380" y="580" width="34" height="50"/>
      <rect x="440" y="580" width="34" height="50"/>
      <rect x="500" y="580" width="34" height="50"/>
      <rect x="560" y="580" width="34" height="50"/>
      <rect x="260" y="660" width="34" height="50"/>
      <rect x="320" y="660" width="34" height="50"/>
      <rect x="380" y="660" width="34" height="50"/>
      <rect x="440" y="660" width="34" height="50"/>
      <rect x="500" y="660" width="34" height="50"/>
      <rect x="560" y="660" width="34" height="50"/>
    </g>

    <!-- Building B: wider -->
    <rect x="660" y="450" width="600" height="310" fill="#90523a" stroke="#5a3020" stroke-width="3"/>
    <polygon points="660,450 1260,450 1240,400 680,400" fill="#7a2818"/>
    <g fill="#1a2230" stroke="#2a3040" stroke-width="1">
      <rect x="700" y="490" width="30" height="48"/><rect x="760" y="490" width="30" height="48"/><rect x="820" y="490" width="30" height="48"/><rect x="880" y="490" width="30" height="48"/><rect x="940" y="490" width="30" height="48"/><rect x="1000" y="490" width="30" height="48"/><rect x="1060" y="490" width="30" height="48"/><rect x="1120" y="490" width="30" height="48"/><rect x="1180" y="490" width="30" height="48"/>
      <rect x="700" y="560" width="30" height="48"/><rect x="760" y="560" width="30" height="48"/><rect x="820" y="560" width="30" height="48"/><rect x="880" y="560" width="30" height="48"/><rect x="940" y="560" width="30" height="48"/><rect x="1000" y="560" width="30" height="48"/><rect x="1060" y="560" width="30" height="48"/><rect x="1120" y="560" width="30" height="48"/><rect x="1180" y="560" width="30" height="48"/>
      <rect x="700" y="630" width="30" height="48"/><rect x="760" y="630" width="30" height="48"/><rect x="820" y="630" width="30" height="48"/><rect x="880" y="630" width="30" height="48"/><rect x="940" y="630" width="30" height="48"/><rect x="1000" y="630" width="30" height="48"/><rect x="1060" y="630" width="30" height="48"/><rect x="1120" y="630" width="30" height="48"/><rect x="1180" y="630" width="30" height="48"/>
    </g>

    <!-- Building C: smaller -->
    <rect x="1320" y="430" width="380" height="330" fill="#a05a3a" stroke="#5a3020" stroke-width="3"/>
    <polygon points="1320,430 1700,430 1680,380 1340,380" fill="#7a2818"/>
    <g fill="#1a2230" stroke="#2a3040" stroke-width="1">
      <rect x="1360" y="470" width="34" height="50"/><rect x="1420" y="470" width="34" height="50"/><rect x="1480" y="470" width="34" height="50"/><rect x="1540" y="470" width="34" height="50"/><rect x="1600" y="470" width="34" height="50"/><rect x="1660" y="470" width="34" height="50"/>
      <rect x="1360" y="550" width="34" height="50"/><rect x="1420" y="550" width="34" height="50"/><rect x="1480" y="550" width="34" height="50"/><rect x="1540" y="550" width="34" height="50"/><rect x="1600" y="550" width="34" height="50"/><rect x="1660" y="550" width="34" height="50"/>
      <rect x="1360" y="630" width="34" height="50"/><rect x="1420" y="630" width="34" height="50"/><rect x="1480" y="630" width="34" height="50"/><rect x="1540" y="630" width="34" height="50"/><rect x="1600" y="630" width="34" height="50"/><rect x="1660" y="630" width="34" height="50"/>
    </g>
  </g>

  <!-- plaza ground -->
  <rect x="0" y="760" width="1920" height="320" fill="#0e1117"/>
  <text x="960" y="900" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Boulder, Colorado · Rishi Raj's research group is in the Paul M. Rady building</text>
  <text x="960" y="930" font-family="JetBrains Mono, monospace" font-size="16" fill="#8b949e" text-anchor="middle">Stylized illustration</text>
</svg>
