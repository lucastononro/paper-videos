<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Arrhenius conductivity curves — flash candidates vs refusers</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">log σ vs 1/T · steep slope = short fuse</text>

  <g transform="translate(160, 200)">
    <rect x="0" y="0" width="1600" height="760" fill="#10141b" stroke="#30363d" stroke-width="2"/>
    <!-- axes -->
    <line x1="80" y1="40" x2="80" y2="700" stroke="#8b949e" stroke-width="2"/>
    <line x1="80" y1="700" x2="1560" y2="700" stroke="#8b949e" stroke-width="2"/>
    <text x="60" y="370" font-family="JetBrains Mono, monospace" font-size="22" fill="#8b949e" transform="rotate(-90 60 370)" text-anchor="middle">log σ</text>
    <text x="820" y="740" font-family="JetBrains Mono, monospace" font-size="22" fill="#8b949e" text-anchor="middle">1/T (1/K)</text>

    <!-- grid -->
    <g stroke="#1f242d" stroke-width="1">
      <line x1="80" y1="180" x2="1560" y2="180"/>
      <line x1="80" y1="320" x2="1560" y2="320"/>
      <line x1="80" y1="460" x2="1560" y2="460"/>
      <line x1="80" y1="600" x2="1560" y2="600"/>
      <line x1="450" y1="40" x2="450" y2="700"/>
      <line x1="820" y1="40" x2="820" y2="700"/>
      <line x1="1190" y1="40" x2="1190" y2="700"/>
    </g>

    <!-- flash candidates: steep curves diverging -->
    <polyline points="100,100 400,180 700,300 1000,460 1300,620 1540,690" fill="none" stroke="#58a6ff" stroke-width="3"/>
    <text x="100" y="86" font-family="JetBrains Mono, monospace" font-size="18" fill="#58a6ff">YSZ</text>
    <polyline points="100,150 400,230 700,360 1000,500 1300,640 1540,695" fill="none" stroke="#7ee787" stroke-width="3"/>
    <text x="200" y="220" font-family="JetBrains Mono, monospace" font-size="18" fill="#7ee787">CeO₂</text>
    <polyline points="100,80 400,140 700,250 1000,400 1300,580 1540,680" fill="none" stroke="#ffd866" stroke-width="3"/>
    <text x="700" y="240" font-family="JetBrains Mono, monospace" font-size="18" fill="#ffd866">SrTiO₃</text>
    <polyline points="100,60 400,120 700,200 1000,360 1300,540 1540,660" fill="none" stroke="#ff8c42" stroke-width="3"/>
    <text x="1300" y="530" font-family="JetBrains Mono, monospace" font-size="18" fill="#ff8c42">MnCo₂O₄ (steepest)</text>

    <!-- refusers: nearly flat -->
    <polyline points="100,650 400,652 700,654 1000,656 1300,658 1540,660" fill="none" stroke="#f97583" stroke-width="3" stroke-dasharray="4 4"/>
    <text x="900" y="640" font-family="JetBrains Mono, monospace" font-size="18" fill="#f97583">Al₂O₃ (refuses)</text>
    <polyline points="100,680 400,680 700,680 1000,680 1300,680 1540,680" fill="none" stroke="#f97583" stroke-width="3" stroke-dasharray="4 4"/>
    <text x="900" y="675" font-family="JetBrains Mono, monospace" font-size="14" fill="#f97583">SiC, WC (refuse)</text>
  </g>

  <text x="960" y="1020" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">Steep slope ≡ flash candidate. Flat slope ≡ refuser.</text>
</svg>
