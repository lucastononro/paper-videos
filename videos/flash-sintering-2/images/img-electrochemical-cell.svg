<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Electrochemistry at the cathode</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">localized reduction — chemistry that pure Joule heating cannot do</text>

  <!-- cell vessel -->
  <g transform="translate(960, 600)">
    <!-- electrolyte (zirconia) box -->
    <rect x="-360" y="-220" width="720" height="440" rx="14" fill="#1a1d24" stroke="#30363d" stroke-width="3"/>
    <text x="0" y="-240" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">YSZ electrolyte</text>

    <!-- anode (left) -->
    <rect x="-360" y="-180" width="40" height="360" fill="#a0a8b4" stroke="#5a5a5a" stroke-width="2"/>
    <text x="-340" y="-200" font-family="Inter, sans-serif" font-size="20" fill="#58a6ff" text-anchor="middle" font-weight="700">+ anode</text>

    <!-- cathode (right) -->
    <rect x="320" y="-180" width="40" height="360" fill="#a0a8b4" stroke="#5a5a5a" stroke-width="2"/>
    <text x="340" y="-200" font-family="Inter, sans-serif" font-size="20" fill="#ff8c42" text-anchor="middle" font-weight="700">− cathode</text>

    <!-- O²⁻ ions migrating left → right? actually O²⁻ go to anode; for redox visualization -->
    <g>
      <text x="-100" y="20" font-family="JetBrains Mono, monospace" font-size="22" fill="#7ee787">O²⁻</text>
      <text x="-160" y="-40" font-family="JetBrains Mono, monospace" font-size="22" fill="#7ee787">O²⁻</text>
      <text x="-50" y="60" font-family="JetBrains Mono, monospace" font-size="22" fill="#7ee787">O²⁻</text>
      <!-- arrows toward anode -->
      <line x1="-50" y1="0" x2="-220" y2="0" stroke="#7ee787" stroke-width="2" marker-end="url(#aend)"/>
    </g>

    <!-- reduced layer near cathode (orange/dark zone) -->
    <rect x="220" y="-180" width="100" height="360" fill="#5a3a2a" opacity="0.65"/>
    <text x="270" y="0" font-family="Inter, sans-serif" font-size="18" fill="#ff8c42" text-anchor="middle">reduced</text>
    <text x="270" y="24" font-family="Inter, sans-serif" font-size="18" fill="#ff8c42" text-anchor="middle">layer</text>
    <text x="270" y="50" font-family="JetBrains Mono, monospace" font-size="14" fill="#c9d1d9" text-anchor="middle">Zr⁴⁺ → Zr³⁺ → Zr⁰</text>

    <defs>
      <marker id="aend" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0 0, 10 5, 0 10" fill="#7ee787"/>
      </marker>
    </defs>
  </g>

  <!-- battery box -->
  <g transform="translate(960, 920)">
    <rect x="-100" y="-30" width="200" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="-50" y="6" font-family="JetBrains Mono, monospace" font-size="22" fill="#58a6ff" text-anchor="middle">+</text>
    <text x="50" y="6" font-family="JetBrains Mono, monospace" font-size="22" fill="#ff8c42" text-anchor="middle">−</text>
  </g>
  <line x1="600" y1="600" x2="600" y2="900" stroke="#ffd866" stroke-width="3"/>
  <line x1="600" y1="900" x2="860" y2="900" stroke="#ffd866" stroke-width="3"/>
  <line x1="1320" y1="600" x2="1320" y2="900" stroke="#ffd866" stroke-width="3"/>
  <line x1="1320" y1="900" x2="1060" y2="900" stroke="#ffd866" stroke-width="3"/>

  <text x="960" y="1020" font-family="Inter, sans-serif" font-size="20" fill="#8b949e" text-anchor="middle">A flashed sample carries chemical fingerprints — atmosphere matters, color matters.</text>
</svg>
