<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Two flashed samples — color, but not composition</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">same powder, same density. One is grey. One is black.</text>

  <!-- Left: grey sample -->
  <g transform="translate(560, 600)">
    <ellipse cx="0" cy="240" rx="200" ry="20" fill="#000" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="200" ry="200" fill="#9a9a9a" stroke="#5a5a5a" stroke-width="3"/>
    <ellipse cx="-50" cy="-50" rx="60" ry="30" fill="#fff" opacity="0.18"/>
    <text x="0" y="-260" font-family="Inter, sans-serif" font-size="26" fill="#c9d1d9" text-anchor="middle" font-weight="700">grey · sintered in air</text>
    <text x="0" y="290" font-family="JetBrains Mono, monospace" font-size="20" fill="#8b949e" text-anchor="middle">99% density · stoichiometric</text>
  </g>

  <!-- Right: black sample -->
  <g transform="translate(1360, 600)">
    <ellipse cx="0" cy="240" rx="200" ry="20" fill="#000" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="200" ry="200" fill="#1a1a1a" stroke="#000" stroke-width="3"/>
    <ellipse cx="-50" cy="-50" rx="60" ry="30" fill="#444" opacity="0.4"/>
    <text x="0" y="-260" font-family="Inter, sans-serif" font-size="26" fill="#ff8c42" text-anchor="middle" font-weight="700">black · sintered in argon</text>
    <text x="0" y="290" font-family="JetBrains Mono, monospace" font-size="20" fill="#8b949e" text-anchor="middle">99% density · O-deficient</text>
  </g>

  <!-- vs label -->
  <text x="960" y="610" font-family="Inter, sans-serif" font-size="60" fill="#e6edf3" text-anchor="middle" font-weight="700">vs</text>

  <text x="960" y="980" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">A pure thermal model says: same heat → same outcome. Reality disagrees.</text>
</svg>
