<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Vincenzo Sglavo &amp; Mattia Biesuz</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Università di Trento — first independent reproduction of flash sintering</text>

  <!-- Two stylized portraits side by side -->
  <g transform="translate(640, 580)">
    <rect x="-220" y="-260" width="440" height="500" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="0" cy="-100" r="80" fill="#2a3140" stroke="#58a6ff" stroke-width="2"/>
    <path d="M -160 220 Q -160 30 -100 0 Q -50 30 0 30 Q 50 30 100 0 Q 160 30 160 220 Z" fill="#2a3140" stroke="#58a6ff" stroke-width="2"/>
    <text x="0" y="280" font-family="Inter, sans-serif" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">Vincenzo Sglavo</text>
    <text x="0" y="310" font-family="Inter, sans-serif" font-size="18" fill="#c9d1d9" text-anchor="middle">Professor of materials science</text>
  </g>

  <g transform="translate(1280, 580)">
    <rect x="-220" y="-260" width="440" height="500" rx="14" fill="#161b22" stroke="#ffd866" stroke-width="3"/>
    <circle cx="0" cy="-100" r="80" fill="#2a3140" stroke="#ffd866" stroke-width="2"/>
    <path d="M -160 220 Q -160 30 -100 0 Q -50 30 0 30 Q 50 30 100 0 Q 160 30 160 220 Z" fill="#2a3140" stroke="#ffd866" stroke-width="2"/>
    <text x="0" y="280" font-family="Inter, sans-serif" font-size="22" fill="#ffd866" text-anchor="middle" font-weight="700">Mattia Biesuz</text>
    <text x="0" y="310" font-family="Inter, sans-serif" font-size="18" fill="#c9d1d9" text-anchor="middle">Researcher, flash &amp; SPS pioneer</text>
  </g>

  <text x="960" y="990" font-family="JetBrains Mono, monospace" font-size="18" fill="#8b949e" text-anchor="middle">Stylized portraits — Trento group</text>
</svg>
