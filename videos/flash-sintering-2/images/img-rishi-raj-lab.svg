<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Raj group lab — field-assisted sintering rig</text>

  <!-- benches -->
  <rect x="100" y="780" width="1720" height="40" fill="#1a1d24" stroke="#30363d" stroke-width="2"/>
  <rect x="100" y="820" width="1720" height="260" fill="#10141b" stroke="#30363d" stroke-width="2"/>

  <!-- tube furnace on left -->
  <g transform="translate(380, 540)">
    <rect x="-180" y="-100" width="360" height="240" rx="14" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="3"/>
    <circle cx="0" cy="20" r="80" fill="#1a1a18" stroke="#5a5a58" stroke-width="3"/>
    <circle cx="0" cy="20" r="55" fill="#a04a1a"/>
    <circle cx="0" cy="20" r="40" fill="#ffa040" opacity="0.85"/>
    <circle cx="0" cy="20" r="22" fill="#ffd866" opacity="0.7"/>
    <text x="0" y="-130" font-family="Inter, sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">tube furnace</text>

    <!-- wires out the side -->
    <line x1="180" y1="20" x2="540" y2="20" stroke="#ffd866" stroke-width="3"/>
    <line x1="-180" y1="20" x2="-340" y2="20" stroke="#ffd866" stroke-width="3"/>
  </g>

  <!-- power supply on right -->
  <g transform="translate(1280, 540)">
    <rect x="-180" y="-180" width="360" height="360" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="0" y="-130" font-family="JetBrains Mono, monospace" font-size="18" fill="#58a6ff" text-anchor="middle">SORENSEN DLM</text>
    <rect x="-140" y="-100" width="280" height="60" fill="#0e1117" stroke="#30363d"/>
    <text x="0" y="-58" font-family="JetBrains Mono, monospace" font-size="30" fill="#ff8c42" text-anchor="middle" font-weight="700">120.0 V</text>
    <rect x="-140" y="-20" width="280" height="60" fill="#0e1117" stroke="#30363d"/>
    <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="30" fill="#ffd866" text-anchor="middle" font-weight="700">0.85 A</text>
    <!-- knobs -->
    <circle cx="-90" cy="100" r="36" fill="#0e1117" stroke="#8b949e" stroke-width="2"/>
    <line x1="-90" y1="100" x2="-90" y2="68" stroke="#ffd866" stroke-width="3"/>
    <circle cx="90" cy="100" r="36" fill="#0e1117" stroke="#8b949e" stroke-width="2"/>
    <line x1="90" y1="100" x2="115" y2="80" stroke="#ffd866" stroke-width="3"/>
    <text x="-90" y="155" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="middle">V</text>
    <text x="90" y="155" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="middle">I-lim</text>
  </g>

  <!-- DAQ box / laptop in middle -->
  <g transform="translate(810, 600)">
    <rect x="-90" y="-50" width="180" height="120" rx="4" fill="#1a1d24" stroke="#30363d" stroke-width="2"/>
    <rect x="-80" y="-40" width="160" height="100" fill="#0e1117"/>
    <!-- mini current trace -->
    <polyline points="-70,40 -50,40 -30,40 -10,40 0,35 6,20 10,-10 14,-30 18,-25 22,-25 30,-25 50,-25 70,-25" fill="none" stroke="#ff8c42" stroke-width="2"/>
    <text x="0" y="90" font-family="JetBrains Mono, monospace" font-size="14" fill="#8b949e" text-anchor="middle">data acquisition</text>
  </g>

  <!-- thermocouple / probe sketch -->
  <line x1="380" y1="450" x2="380" y2="380" stroke="#c9d1d9" stroke-width="3"/>
  <circle cx="380" cy="372" r="8" fill="#c9d1d9"/>
  <text x="400" y="380" font-family="Inter, sans-serif" font-size="16" fill="#8b949e">thermocouple</text>

  <text x="960" y="970" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">A small tube furnace, a power supply, a data-acquisition box. That was the whole rig.</text>
</svg>
