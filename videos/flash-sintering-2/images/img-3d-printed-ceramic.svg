<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">3D-printed ceramic part</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">complex geometry, fragile after print, distorts in conventional sintering</text>

  <!-- printed lattice cube, isometric -->
  <g transform="translate(960, 600)">
    <!-- back face -->
    <polygon points="-260,-200 260,-200 320,-140 -200,-140" fill="#3a4055" stroke="#7a8090" stroke-width="2"/>
    <polygon points="260,-200 260,180 320,240 320,-140" fill="#5a6072" stroke="#7a8090" stroke-width="2"/>
    <polygon points="-260,-200 -260,180 -200,240 -200,-140" fill="#5a6072" stroke="#7a8090" stroke-width="2"/>
    <polygon points="-200,-140 320,-140 320,240 -200,240" fill="#444a55" stroke="#7a8090" stroke-width="2"/>

    <!-- lattice openings on the front face -->
    <g fill="#0e1117" stroke="#7a8090" stroke-width="2">
      <rect x="-160" y="-100" width="80" height="80"/>
      <rect x="-60" y="-100" width="80" height="80"/>
      <rect x="40" y="-100" width="80" height="80"/>
      <rect x="140" y="-100" width="80" height="80"/>
      <rect x="-160" y="0" width="80" height="80"/>
      <rect x="-60" y="0" width="80" height="80"/>
      <rect x="40" y="0" width="80" height="80"/>
      <rect x="140" y="0" width="80" height="80"/>
      <rect x="-160" y="100" width="80" height="80"/>
      <rect x="-60" y="100" width="80" height="80"/>
      <rect x="40" y="100" width="80" height="80"/>
      <rect x="140" y="100" width="80" height="80"/>
    </g>
  </g>

  <text x="960" y="970" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Putting this through a conventional kiln warps it.</text>
  <text x="960" y="1000" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Flash sintering, on the printing bed, does not.</text>
</svg>
