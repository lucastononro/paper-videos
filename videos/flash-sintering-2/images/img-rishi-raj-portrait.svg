<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">Rishi Raj</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">University of Colorado Boulder · pioneer of flash sintering</text>

  <!-- Portrait frame -->
  <g transform="translate(960, 600)">
    <rect x="-220" y="-280" width="440" height="540" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <!-- silhouette / abstract figure -->
    <circle cx="0" cy="-110" r="92" fill="#2a3140" stroke="#58a6ff" stroke-width="2"/>
    <!-- shoulders -->
    <path d="M -180 240 Q -180 30 -110 -10 Q -60 30 0 30 Q 60 30 110 -10 Q 180 30 180 240 Z" fill="#2a3140" stroke="#58a6ff" stroke-width="2"/>
  </g>

  <!-- Bio block on right -->
  <g transform="translate(1280, 400)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="28" fill="#58a6ff" font-weight="700">Rishi Raj</text>
    <text x="0" y="40" font-family="Inter, sans-serif" font-size="22" fill="#c9d1d9">Professor, Mechanical Engineering</text>
    <text x="0" y="70" font-family="Inter, sans-serif" font-size="22" fill="#c9d1d9">University of Colorado Boulder</text>
    <line x1="0" y1="100" x2="320" y2="100" stroke="#30363d" stroke-width="2"/>
    <text x="0" y="140" font-family="Inter, sans-serif" font-size="20" fill="#8b949e">21 years at Cornell, then CU since 1996</text>
    <text x="0" y="170" font-family="Inter, sans-serif" font-size="20" fill="#8b949e">field-assisted sintering since the 1980s</text>
    <text x="0" y="200" font-family="Inter, sans-serif" font-size="20" fill="#8b949e">2010 paper: ~1,500 citations</text>
  </g>

  <text x="960" y="990" font-family="JetBrains Mono, monospace" font-size="18" fill="#8b949e" text-anchor="middle">Stylized portrait — see colorado.edu/mechanical/rishi-raj for the official photo</text>
</svg>
