<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0e1117"/>
  <text x="960" y="80" font-family="Inter, sans-serif" font-size="42" fill="#e6edf3" text-anchor="middle" font-weight="700">SOFC thin-film electrolyte — cross-section</text>
  <text x="960" y="120" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">a few micrometres of dense YSZ, 95%+ density, fine grain</text>

  <!-- horizontal layered stack -->
  <g transform="translate(960, 540)">
    <!-- cathode (porous) -->
    <rect x="-700" y="-300" width="1400" height="120" fill="#a04a78" stroke="#c06490" stroke-width="2"/>
    <g fill="#0e1117" opacity="0.5">
      <circle cx="-600" cy="-260" r="14"/><circle cx="-450" cy="-240" r="16"/><circle cx="-300" cy="-260" r="14"/><circle cx="-150" cy="-240" r="16"/><circle cx="0" cy="-260" r="14"/><circle cx="150" cy="-240" r="16"/><circle cx="300" cy="-260" r="14"/><circle cx="450" cy="-240" r="16"/><circle cx="600" cy="-260" r="14"/>
      <circle cx="-540" cy="-220" r="12"/><circle cx="-380" cy="-200" r="14"/><circle cx="-220" cy="-220" r="12"/><circle cx="-60" cy="-200" r="14"/><circle cx="80" cy="-220" r="12"/><circle cx="240" cy="-200" r="14"/><circle cx="400" cy="-220" r="12"/><circle cx="540" cy="-200" r="14"/>
    </g>
    <text x="-680" y="-260" font-family="JetBrains Mono, monospace" font-size="22" fill="#fff">LSCF cathode (porous)</text>

    <!-- electrolyte (dense, thin) -->
    <rect x="-700" y="-180" width="1400" height="40" fill="#5a6072" stroke="#8b949e" stroke-width="2"/>
    <text x="-680" y="-150" font-family="JetBrains Mono, monospace" font-size="20" fill="#e6edf3">YSZ electrolyte ≈ 5 µm — DENSE</text>

    <!-- anode (porous) -->
    <rect x="-700" y="-140" width="1400" height="160" fill="#3a4055" stroke="#5a6072" stroke-width="2"/>
    <g fill="#0e1117" opacity="0.5">
      <circle cx="-600" cy="-100" r="16"/><circle cx="-460" cy="-80" r="18"/><circle cx="-310" cy="-100" r="16"/><circle cx="-160" cy="-80" r="18"/><circle cx="-10" cy="-100" r="16"/><circle cx="140" cy="-80" r="18"/><circle cx="290" cy="-100" r="16"/><circle cx="440" cy="-80" r="18"/><circle cx="590" cy="-100" r="16"/>
      <circle cx="-540" cy="-40" r="14"/><circle cx="-380" cy="-20" r="16"/><circle cx="-220" cy="-40" r="14"/><circle cx="-60" cy="-20" r="16"/><circle cx="80" cy="-40" r="14"/><circle cx="240" cy="-20" r="16"/><circle cx="400" cy="-40" r="14"/><circle cx="540" cy="-20" r="16"/>
    </g>
    <text x="-680" y="-100" font-family="JetBrains Mono, monospace" font-size="22" fill="#fff">Ni-YSZ anode (porous)</text>

    <!-- ion arrow (O²⁻) crossing electrolyte downward -->
    <g stroke="#7ee787" stroke-width="3" fill="none">
      <line x1="0" y1="-260" x2="0" y2="-100" marker-end="url(#oarrow)"/>
    </g>
    <text x="20" y="-180" font-family="JetBrains Mono, monospace" font-size="20" fill="#7ee787">O²⁻</text>

    <defs>
      <marker id="oarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <polygon points="0 0, 10 5, 0 10" fill="#7ee787"/>
      </marker>
    </defs>
  </g>

  <text x="960" y="970" font-family="Inter, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">Conventional sintering coarsens the electrolyte grain → ruins the film. Flash sintering does not.</text>
</svg>
